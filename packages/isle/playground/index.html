<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Isle playground</title>
    <style>
      :root {
        --ink: #1f2430;
        --muted: #5b6372;
        --panel: rgba(255, 255, 255, 0.9);
        --line: rgba(31, 36, 48, 0.12);
        --accent: #d9813a;
        --accent-ink: #ffffff;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--ink);
        background: #e4f3f4;
      }
      #isle {
        position: fixed;
        inset: 0;
      }
      .panel {
        position: fixed;
        top: 12px;
        left: 12px;
        width: 268px;
        max-width: calc(100vw - 24px);
        padding: 12px;
        border-radius: 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: 0 8px 30px rgba(20, 30, 50, 0.12);
        backdrop-filter: blur(8px);
      }
      .panel h1 {
        margin: 0 0 8px;
        font-size: 15px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 6px 0;
        flex-wrap: wrap;
      }
      .row label {
        flex: 1 1 70px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 12px;
        color: var(--muted);
      }
      input[type="number"],
      select {
        width: 100%;
        padding: 5px 6px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
        background: #fff;
      }
      button {
        min-height: 36px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: transparent;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .check {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 13px;
      }
      #stats {
        margin-top: 8px;
        font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted);
        white-space: pre;
      }
      #label {
        position: fixed;
        transform: translate(-50%, calc(-100% - 10px));
        padding: 8px 10px;
        max-width: 240px;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 6px 20px rgba(20, 30, 50, 0.18);
        pointer-events: none;
        font-size: 13px;
      }
      #label strong {
        display: block;
      }
      #label span {
        color: var(--muted);
        font-size: 12px;
      }
      #card {
        position: fixed;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        min-width: 240px;
        max-width: calc(100vw - 24px);
        padding: 12px 16px;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 10px 30px rgba(20, 30, 50, 0.2);
        text-align: center;
      }
      #card small {
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 11px;
      }
      #card h2 {
        margin: 2px 0 4px;
        font-size: 17px;
      }
      #card ul {
        list-style: none;
        margin: 0;
        padding: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .toggle {
        display: none;
      }
      @media (max-width: 600px) {
        .panel {
          top: auto;
          bottom: 12px;
        }
        .panel.closed .body {
          display: none;
        }
        .toggle {
          display: inline-block;
          float: right;
          min-height: 28px;
        }
      }
      body.bare .panel,
      body.bare #stats {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="isle"></div>
    <div class="panel" id="panel">
      <button class="toggle" id="toggle" type="button">Controls</button>
      <h1>Isle playground</h1>
      <div class="body">
        <div class="row">
          <label>Lessons <input id="lessons" type="number" min="0" max="2000" /></label>
          <label>Modules <input id="modules" type="number" min="0" max="500" /></label>
          <label>Units <input id="units" type="number" min="1" max="5" /></label>
        </div>
        <div class="row">
          <label>Seed <input id="seed" type="number" min="1" /></label>
          <label
            >Time
            <select id="time">
              <option value="auto">Local time</option>
              <option value="day">Day</option>
              <option value="dusk">Dusk</option>
              <option value="night">Night</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label
            >Add to unit
            <select id="unit">
              <option>basics</option>
              <option>switching</option>
              <option>permanent</option>
              <option>chips</option>
              <option>beyond</option>
            </select>
          </label>
          <label
            >Quality
            <select id="quality">
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
          </label>
        </div>
        <div class="row">
          <button class="primary" id="addLesson" type="button">+ lesson</button>
          <button class="primary" id="addModule" type="button">+ module</button>
          <button id="apply" type="button">Rebuild</button>
        </div>
        <div class="row">
          <label class="check"><input id="reduced" type="checkbox" /> Reduced motion</label>
          <label class="check"><input id="muted" type="checkbox" /> Muted</label>
        </div>
        <div id="stats"></div>
      </div>
    </div>
    <div id="label" hidden></div>
    <div id="card" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
