<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ohmland bench playground</title>
    <style>
      /* A subset of the classic notebook tokens, as the app defines them, so the bench can follow the theme. */
      :root {
        --paper: #f6f2e9;
        --paper-slip: #fcfaf5;
        --paper-sunk: #eee8dc;
        --grid: #e7e0d3;
        --margin-rose: #e2a49c;
        --ink: #24221e;
        --ink-2: #57524a;
        --ink-3: #6b655b;
        --rule-soft: #d8d0c1;
        --shadow-ink: #e1d9ca;
        --blue: #1f3c9a;
        --blue-wash: #e1e6f4;
        --red: #b23a1c;
        --focus: #1f3c9a;
        --font-serif: "Literata", Georgia, "Times New Roman", serif;
      }
      :root[data-theme="dark"] {
        --paper: #1b1a18;
        --paper-slip: #242320;
        --paper-sunk: #141312;
        --grid: #252422;
        --margin-rose: #6a3f3a;
        --ink: #ece6da;
        --ink-2: #bdb6a8;
        --ink-3: #9a9488;
        --rule-soft: #3a3833;
        --shadow-ink: #0f0e0d;
        --blue: #9ab3f4;
        --blue-wash: #26304a;
        --red: #f2906f;
        --focus: #9ab3f4;
      }
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: var(--paper);
        font-family: var(--font-serif);
        color: var(--ink);
      }
      * {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
