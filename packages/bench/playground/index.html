<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ohmland bench playground</title>
    <!-- The notebook faces for the ink view (the web app ships its own). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Kalam:wght@400;700&display=swap" />
    <script>
      (function () {
        var t = new URLSearchParams(location.search).get("theme");
        if (t) document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #e9e0d4;
        font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: #2b2620;
      }
      * {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
