# Blueprint: docs/curriculum/unit-4.md, CH7. A bench lesson (docs/LESSONS.md).
# One idea: join pin 2 to the capacitor and the 555 triggers itself every time it empties: it blinks forever.
# New: the word "astable". Lab: content/labs/blink-forever.ts. A half board has no room for the blueprint's second,
# one-shot 555, so the "show me the astable" tap is left out and the pick checks the word. The second-lamp secret became
# parking pin 2 back on plus (no extra parts in the tray to confuse the capacitor swap), and the fix-it's 0.1 µF swap
# became a slipped jumper (one drag, no electrolytic to stretch across the rails).
format: bench
id: blink-forever
version: 1
title: It never rests
summary: Move one jumper so a 555 triggers itself, watch its capacitor swing between the lines, and slow the blink.
minutes: 6
lab: blink-forever
unlocks:
  parts: []
  isle: transistor

start:
  title: It never rests
  say: My lighthouse needs a lamp that blinks by itself.
  go: Build the blinker

beats:
  - say: Move pin 2's jumper onto the capacitor's strip.
    objective: Blink forever
    do: blink-forever
    done: It blinks by itself!
    note: { at: W4.b, text: "astable: it triggers itself" }

  - say: Watch the capacitor on the scope.
    tool: scope
    do: swing
    note: { at: C1, text: "up to 2/3, down to 1/3" }
    rule: "Pin 2 on the capacitor: it never rests."

  - say: Drop the 22 µF onto the 10 µF.
    objective: Slow it down
    guess: { options: [It blinks slower, It blinks faster], answer: It blinks slower }
    do: bigger-c
    note: { at: C3, text: "bigger C, slower blink" }

  - say: What is my 555 now?
    pick: { on: U1, options: [An astable, A one-shot, A latch], answer: An astable }
    wrong:
      A one-shot: "A one-shot glows once per tap. This one never stops."
      A latch: "A latch stays put. This one keeps flipping."

secret:
  task: rest
  say: Curious? Park pin 2's jumper back on plus.
  done: One last blink, then it rested.
  note: { at: W4.b, text: "off the capacitor: it rests" }

fixit:
  say: My lighthouse lamp won't blink. Fix it.
  tasks:
    - task: fix-slipped

end:
  say: My lighthouse never sleeps.
