# Blueprint: docs/curriculum/unit-1.md, L17, trimmed (docs/curriculum/conversion-guide.md, B3 17). A bench lesson
# (docs/LESSONS.md). One idea: cells chained plus to minus add their push. Lab: content/labs/stack-the-cells.ts.
format: bench
id: stack-the-cells
version: 2
title: Stack the cells
summary: Chain lemon cells zinc to copper, watch their pushes add up, and light an LED with fruit.
minutes: 8
lab: stack-the-cells
unlocks:
  parts: []
  isle: lemon-tree

start:
  title: Light it with fruit
  say: One lemon gave 0.9 V. My face needs more.
  go: Build a team

beats:
  - say: Clip one cell's zinc to the next one's copper. Measure both.
    objective: Two in a chain
    do: two-in-series
    tool: meter
    note: { at: FC2, text: "zinc to copper: pushes add" }

  - say: Now link them copper to copper. Guess first.
    guess: { options: [Still 1.8 V, About 0 V, About 3.6 V], answer: About 0 V }
    do: wrong-way
    tool: meter
    note: { at: FC1, text: "back to back: they cancel" }

  - say: Chain all four, zinc to copper. Guess the total.
    objective: Four in a chain
    guess: { options: [0.9 V, 1.8 V, 3.6 V], answer: 3.6 V }
    do: four-stack
    tool: meter
    done: 3.66 V. Enough for an LED.
    rule: "Chain cells: their pushes add."

  - say: LED across the stack, long leg to copper. Dim the lights.
    objective: Light my face
    do: light-it
    tool: controls
    done: A glow from fruit!

  - say: A 9 V battery hides 1.5 V cells. How many?
    pick: { options: [Two, Six, Nine], answer: Six }
    wrong:
      Two: "Two would give 3 V. Keep adding."
      Nine: "Nine would give 13.5 V. Too many."

secret:
  task: why-no-resistor
  tool: meter
  say: Curious? No resistor, yet it lives. Measure the stack.
  done: 1.7 V. The lemons hold the flow back.
  note: { at: FC1, text: "about 1 kΩ inside each lemon" }

fixit:
  say: Fix-it time. My fruit lamp went dim. Find the rebel.
  tasks:
    - task: one-reversed

end:
  say: Fruit-powered face. Best day on this island.
