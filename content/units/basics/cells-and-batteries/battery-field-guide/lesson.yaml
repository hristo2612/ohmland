# Blueprint: docs/curriculum/unit-1.md, L18, the kept half after the split (docs/curriculum/conversion-guide.md, B3 18).
# A bench lesson (docs/LESSONS.md). One idea: some batteries hold their push under load and some sag, so match the
# battery to the job. Run time moved to how-long. Lab: content/labs/battery-field-guide.ts.
format: bench
id: battery-field-guide
version: 2
title: A field guide to batteries
summary: Test four batteries at rest and under load, find the sippers and the gulpers, and match each to its job.
minutes: 6
lab: battery-field-guide
unlocks:
  parts: [coin-cell]
  isle: cell-jar

start:
  title: Sippers and gulpers
  say: Four batteries, four personalities. Let's test them.
  go: Let's test

beats:
  - say: Load off. Drop each battery in the tester.
    objective: At rest
    do: survey
    tool: meter
    done: Four pushes. All healthy, at rest.
    note: { at: X2, text: "rechargeable: lower push, by design" }

  - say: Flip the load on. Test all four again.
    objective: Under load
    do: load-test
    tool: meter
    done: The AAs shrug. The coin cell wilts.
    note: { at: X3, text: "sags under load: a sipper" }
    rule: Big flow needs a gulper.

  - say: What job suits this one best?
    objective: Match the job
    pick: { on: X3, options: [A watch, A torch, A toy motor], answer: A watch }
    wrong:
      A torch: "A torch gulps flow. This one would sag."
      A toy motor: "Motors gulp. This one sips."

  - say: These two deserve respect. Read their cards.
    spot: [SC1]

fixit:
  say: Fix-it time. My load drags the coin cell down.
  tool: meter
  tasks:
    - task: pick-a-gulper

end:
  say: Sippers for watches, gulpers for torches. Field guide done.
