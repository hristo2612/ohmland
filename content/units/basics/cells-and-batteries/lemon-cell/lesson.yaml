# Blueprint: docs/curriculum/unit-1.md, L16, trimmed (docs/curriculum/conversion-guide.md, B3 16). A bench lesson
# (docs/LESSONS.md). One idea: two different metals in juice make a push. Lab: content/labs/lemon-cell.ts.
format: bench
id: lemon-cell
version: 2
title: A battery from the fruit bowl
summary: Push copper and zinc into a lemon, measure its push, find its plus side, and see why two coins give nothing.
minutes: 7
lab: lemon-cell
unlocks:
  parts: [fruit-cell]
  isle: lemon-tree

start:
  title: Lemon power
  say: Lunch or laboratory? Today, this lemon is both.
  go: Let's squeeze

beats:
  - say: Push a copper coin and a zinc strip in.
    objective: Make a cell
    do: push-in

  - say: Red probe on the copper, black on the zinc.
    do: make-a-cell
    tool: meter
    note: { at: FC1, text: "a lemon cell: about 0.9 V" }
    rule: Two different metals in juice make a cell.

  - say: Swap the probes. Guess first.
    objective: Find the plus side
    guess: { options: [Same reading, A minus sign, Zero], answer: A minus sign }
    do: which-is-plus
    tool: meter
    note: { at: FC1, text: "copper plus, zinc minus" }

  - say: Swap the zinc for the other copper coin.
    objective: Two of a kind
    guess: { options: [About 0 V, About 0.9 V, About 1.8 V], answer: About 0 V }
    do: same-metal
    tool: meter
    done: Nothing. Same metals push equally.
    note: { at: E2, text: "same metal: no push" }

  - say: So where does the energy come from?
    pick: { options: ["The zinc, used up", The lemon juice, The copper coin], answer: "The zinc, used up" }
    wrong:
      The lemon juice: "The juice only carries ions. Vinegar works too."
      The copper coin: "The copper just collects. It isn't used up."

secret:
  task: one-lemon-led
  say: Curious? Zinc back in. Can one lemon light an LED?
  done: Not a flicker. A red LED wants about 2 V.
  note: { at: FC1, text: "one lemon: not enough push" }

fixit:
  say: Fix-it time. My lemon reads zero. Why?
  tool: meter
  tasks:
    - task: touching

end:
  say: A fruit-bowl battery. Just don't eat it.
