# Blueprint: docs/curriculum/unit-1.md, L7. A bench lesson (docs/LESSONS.md), and the reference for the format.
# One idea: an LED works one way round, and it needs a resistor. Lab: content/labs/first-glow.ts.
format: bench
id: first-glow
version: 2
title: Your first glow
summary: Wire a battery, a resistor and an LED into a loop, and find out which way an LED goes.
minutes: 8
lab: first-glow
unlocks:
  parts: [led-red]
  isle: led-lamp

start:
  say: My face is one LED. It's been dark for weeks. Wire me a glow?
  go: Let's wire it

beats:
  - say: This is an LED. Tap it.
    meet: D1
    note: { at: D1, text: LED }

  - say: Clip a loop. Plus, resistor, LED, minus.
    do: build-loop
    done: It glows! First light on this island in ages.
    note: { at: R1, text: holds it to about 5 mA }

  - say: Want me brighter? Try another resistor.
    popup: { widget: resistor-slider, at: R1, props: { part: R1, led: D1, values: [470, 1000, 1500, 4700, 10000] } }

  - say: Quick one. Tap the long leg.
    tap: { answer: D1.anode, among: [D1.anode, D1.cathode] }
    wrong: { D1.cathode: "That's the short leg. Try the other." }
    note: { at: D1.anode, text: "long leg: anode, toward plus" }
    rule: "LED: long leg to plus."

  - say: Swap the LED's legs. Guess first.
    guess: { options: [It still glows, It goes dark, It burns out], answer: It goes dark }
    do: flip-led
    done: Dark. And not broken.
    note: { at: D1, text: "backwards: blocked" }
    rule: LEDs work one way only.

  - say: Now make it glow again.
    do: flip-back

fixit:
  say: Fix-it time. No glow here. Why?
  tasks:
    - task: fix-reversed

secret:
  task: no-resistor
  say: Curious? Leave the resistor out. It's free here.
  done: Pop. That LED gave its life for science.
  note: { at: D1, text: about 1 A for a blink }
  rule: Every LED needs a resistor.

end:
  say: You built that from scratch. My face approves.
