# Blueprint: docs/curriculum/unit-1.md, L9. A bench lesson (docs/LESSONS.md), trimmed per
# docs/curriculum/conversion-guide.md, B3. One idea: to count flow, the meter goes into the loop.
# Lab: content/labs/measure-the-flow.ts.
format: bench
id: measure-the-flow
version: 2
title: Measuring the flow
summary: Put the meter into the loop to count the current, and blow its fuse once by doing it wrong.
minutes: 9
lab: measure-the-flow
unlocks:
  parts: []
  isle: test-lead-arch

start:
  title: Count the flow
  say: Brightness is a guess. Let's count the flow.
  go: Count it

beats:
  - say: Red plug into mA. Dial to mA, range 200 mA.
    objective: Set up
    tool: meter
    do: set-up-amps
    note: { at: part:M1/ma, text: "mA: the flow socket" }

  - say: Unclip red from plus. Bridge the gap with the meter.
    objective: Into the loop
    tool: meter
    do: break-and-bridge
    done: 15.8 mA, right through the meter.
    note: { at: part:M1/display, text: the meter fills the gap }
    rule: Count flow through the meter.

  - say: Now, still on mA, probe across the battery.
    objective: The classic
    tool: meter
    guess: { options: [a big number, a pop, nothing], answer: a pop }
    do: the-classic
    done: Pop. Every meter owner does that once.
    note: { at: part:M1/display, text: "over 3 A: fuse melted" }

  - say: Quick one. mA now reads zero everywhere. Why?
    pick: { options: [a blown fuse, a flat battery, no flow], answer: a blown fuse }
    hint: What just went pop?

  - say: Fit a fresh fuse. Then count the flow properly.
    tool: meter
    do: fresh-fuse
    done: Back in business.

secret:
  task: other-side
  say: Curious? Count on the far side of the LED.
  tool: meter
  done: Same number.
  note: { at: D1, text: "same number: your gates were right" }

fixit:
  say: Fix-it time. My lamp went out when I measured.
  tool: meter
  tasks:
    - task: fix-across

end:
  say: Flow counted. Through the meter, never across.
