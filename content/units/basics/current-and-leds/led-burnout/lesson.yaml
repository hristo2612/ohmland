# Blueprint: docs/curriculum/unit-1.md, L8. A bench lesson (docs/LESSONS.md) on the half breadboard, trimmed per
# docs/curriculum/conversion-guide.md, B3; it also takes first-glow's "why the resistor" as its first discovery.
# One idea: less squeeze means more flow, and past its limit an LED dies for good. Lab: content/labs/led-burnout.ts.
format: bench
id: led-burnout
version: 3
title: One LED, too much current
summary: Swap in smaller and smaller resistors until the LED gives up, and learn why every LED needs one.
minutes: 8
lab: led-burnout
unlocks:
  parts: []
  isle: diode

start:
  title: How bright is too bright?
  say: Brighter is better, right? Let's test that.
  go: Let's test

beats:
  - say: Swap the 1.5 kΩ for the 470 Ω. Same holes.
    objective: Brighter
    do: brighter
    done: Brighter! Same LED, same battery.
    note: { at: R2, text: the resistor sets the flow }

  - say: Now 150 Ω. Watch the stress bar above the LED.
    spot: [D1]
    do: brighter-still
    done: Dazzling, and nearly at its limit.
    note: { at: "part:D1/stress", text: "stress bar: 48 of 50 mA" }

  - say: Go on. Try 15 Ω.
    objective: Too far
    guess: { options: [even brighter, "flash, then dark", no change], answer: "flash, then dark" }
    do: too-far
    done: Pop. Over 300 mA.
    note: { at: D1, text: "far past its limit: cooked" }
    rule: Never cross a part's maximum.

  - say: Put 1.5 kΩ back. Then a fresh LED. Guess first.
    objective: No comeback
    guess: { options: [old one glows, old one stays dark], answer: old one stays dark }
    do: no-comeback
    done: Fresh LED, happy glow.
    note: { at: D1, text: dead stays dead }

  - say: Fit the resistor for the brightest LED that survives.
    do: brightest-survivor
    done: Bright, and still alive.

  - say: Which current for a lamp that lasts years?
    pick: { options: [15 mA, 45 mA, 60 mA], answer: 15 mA }
    wrong: { 45 mA: "Allowed, but it runs hot near the limit.", 60 mA: "Past the 50 mA limit. Pop." }

fixit:
  say: Fix-it time. My stress bar is red. Calm it down.
  # The hot resistor, the calm one waiting on the desk, and the lamp's holes (its LED, and the stress bar over it).
  spot: [R3, R2, "hole:e10", "hole:e11"]
  tasks:
    - task: fix-hot-lamp

end:
  say: Bright enough, and built to last.
