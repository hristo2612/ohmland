# Blueprint: docs/curriculum/unit-1.md, L13, the kept half after the split (docs/curriculum/conversion-guide.md, B3 13).
# A bench lesson (docs/LESSONS.md). One idea: a power rating is the heat a part can shed, so pick one with room to
# spare. P = V × I moved to count-the-watts. Lab: content/labs/watts-and-heat.ts.
format: bench
id: watts-and-heat
version: 2
title: Smoke and ratings
summary: Put 4 W into three 15 Ω resistors of different sizes, see which survive, and pick a rating with room to spare.
minutes: 7
lab: watts-and-heat
unlocks:
  parts: [resistor-power]
  isle: heatsink

start:
  title: Smoke and ratings
  say: Three 15 Ω resistors, three sizes. Which survives 4 W?
  go: Let's cook

beats:
  - say: Little one first. Clip in the 15 Ω, 1/4 W.
    objective: Cook one
    guess: { options: [Stays cool, Gets warm, Smokes], answer: Smokes }
    do: cook-one
    note: { at: R2, text: "17 times its rating: cooked" }

  - say: Now the big white one. Give it ten seconds.
    objective: Keep one alive
    do: survive-ten
    done: Warm, and still going strong.
    note: { at: R5, text: "rated 5 W: it copes" }
    rule: A rating is the heat it can shed.

  - say: A part will make 0.6 W. Which rating?
    objective: Pick with room
    pick: { options: [1/4 W, 1 W, 2 W], answer: 2 W }
    wrong:
      1/4 W: "Under half the heat it must shed. Smoke."
      1 W: "It survives, but runs hot. Leave more room."
    rule: Pick a rating twice the power.

secret:
  task: one-watt-too
  say: Curious? Try the 1 W one. Patience.
  done: Smoke, slower. 4 W is still too much.
  note: { at: R4, text: "1 W: smokes at 4 W" }

fixit:
  say: Fix-it time. This 47 Ω resistor keeps smoking.
  tasks:
    - task: rate-it

end:
  say: Right size, no smoke. You read ratings now.
