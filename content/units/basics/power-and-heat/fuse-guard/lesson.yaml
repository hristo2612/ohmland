# Blueprint: docs/curriculum/unit-1.md, L14, the kept half after the split (docs/curriculum/conversion-guide.md, B3 14).
# A bench lesson (docs/LESSONS.md). One idea: a fuse melts on purpose to save the rest, and the beep shows the gap.
# The 10A socket moved to big-current. Lab: content/labs/fuse-guard.ts.
format: bench
id: fuse-guard
version: 2
title: The weak link
summary: Blow a fuse on purpose, hear the gap it leaves with the continuity beep, and fit the rating that protects.
minutes: 6
lab: fuse-guard
unlocks:
  parts: [fuse]
  isle: fuse

start:
  title: The weak link
  say: Meet the bravest part on the bench. It's built to fail.
  go: Let's meet it

beats:
  - say: This is a fuse. A thin wire in glass. Tap it.
    objective: Blow one
    meet: F1
    note: { at: F1, text: fuse }

  - say: Clip it straight across the battery. Guess first.
    guess: { options: [Nothing happens, It gets warm, It blows], answer: It blows }
    do: blow-1a
    note: { at: F1, text: "melted: a gap on purpose" }
    rule: A fuse melts to save the rest.

  - say: Does a 1 A fuse hold the flow at 1 A?
    pick: { options: ["Yes, at 1 A", "No, it just melts"], answer: "No, it just melts" }
    wrong: { "Yes, at 1 A": "It never holds anything. Wire or gap, that's all." }

  - say: Dial to the beep. Probe the blown fuse, then the 3 A.
    objective: Hear the gap
    do: continuity-check
    tool: meter
    note: { at: F2, text: "beep: joined. Silence: a gap." }

  - say: What is this?
    pick: { on: F2, options: [A fuse, A resistor, A battery], answer: A fuse }

fixit:
  say: Fix-it time. This short should blow the fuse. It doesn't.
  tasks:
    - task: fix-short

end:
  say: Brave little wire. It fails so nothing else has to.
