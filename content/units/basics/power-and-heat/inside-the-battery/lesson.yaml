# Blueprint: docs/curriculum/unit-1.md, L15, trimmed (docs/curriculum/conversion-guide.md, B3 15). A bench lesson
# (docs/LESSONS.md). One idea: a battery hides a resistance, so its push sags under load.
# Lab: content/labs/inside-the-battery.ts.
format: bench
id: inside-the-battery
version: 2
title: The battery's hidden resistor
summary: Catch a battery's hidden resistance by reading its push at rest and under load, then unmask an old one.
minutes: 8
lab: inside-the-battery
unlocks:
  parts: []
  isle: battery

start:
  title: Catch the hidden resistor
  say: Batteries keep secrets. Let's catch one.
  go: Catch it

beats:
  - say: Load off. Dial to DC volts. Read the push.
    objective: Rest, then work
    do: open-voltage
    tool: meter
    note: { at: B1, text: "at rest: 9.4 V" }

  - say: Now switch the 15 Ω load on.
    guess: { options: [Stays 9.4 V, It drops, It rises], answer: It drops }
    do: loaded-voltage
    tool: meter
    done: Down about a volt. Where did it go?
    note: { at: B1, text: "working: about 8.4 V" }

  - say: Lost inside, at 0.56 A. Ohms = volts ÷ amps.
    objective: Unmask it
    do: find-r
    note: { at: B1, text: "about 1.8 Ω, hiding inside" }
    rule: Every battery hides a resistor.

  - say: Swap in the old battery. Read it off, then on.
    objective: An old one
    do: old-battery
    tool: meter
    done: 8.6 V resting. Under 6 V working.
    note: { at: B2, text: "old: a big hidden resistor" }
    rule: Test a battery while it works.

  - say: It reads 9.1 V, but my gadget dies. Why?
    pick: { options: [Big hidden resistor, The meter lies, Wants exactly 9 V], answer: Big hidden resistor }
    wrong:
      The meter lies: "The meter's right. At rest, nothing sags."
      Wants exactly 9 V: "Gadgets take a range. 9.1 V would do, if it held."

secret:
  task: watch-it-sag
  tool: meter
  say: Curious? Fresh one, load on, twenty seconds.
  done: It sinks, then recovers a little.
  note: { at: B1, text: "chemistry catches up slowly" }

fixit:
  say: Fix-it time. This one reads 8.6 V. My load starves.
  tool: meter
  tasks:
    - task: fix-old

end:
  say: Hidden resistor, caught red-handed.
