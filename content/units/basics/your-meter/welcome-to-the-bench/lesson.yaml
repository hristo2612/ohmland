# Blueprint: docs/curriculum/unit-1.md, L1. A bench lesson (docs/LESSONS.md).
# One idea: current only flows around a complete loop. Lab: content/labs/welcome-to-the-bench.ts.
format: bench
id: welcome-to-the-bench
version: 2
title: Welcome to the bench
summary: Light your first LED with a switch and learn that current needs a complete loop.
minutes: 6
lab: welcome-to-the-bench
unlocks:
  parts: [battery-9v, alligator-clips]
  isle: switch

start:
  say: Welcome to the bench. My face runs on fumes.
  go: Let's look

beats:
  - say: This is a switch. Flip it on.
    spot: [S1]
    do: close-the-switch
    done: A glow! First light on this island in ages.
    note: { at: D1, text: current flows all the way round }

  - say: Unclip any one lead. Guess first.
    guess: { options: [It stays on, It gets dimmer, It goes out], answer: It goes out }
    do: break-the-loop
    done: Dark. Everywhere at once.
    note: { at: D1, text: one gap stops it all }
    rule: Current needs a full loop.

  - say: Clip it back on.
    do: mend-the-loop

  - say: What is this?
    pick: { on: S1, options: [A switch, A battery, A resistor], answer: A switch }
    rule: A switch opens and closes the loop.

fixit:
  say: Fix-it time. The switch is on. No light.
  tasks:
    - task: fix-switch

secret:
  task: swap-battery-leads
  say: Curious? Swap the battery's two clips.
  done: Dark, and nothing broke.
  note: { at: D1, text: "backwards: no light, no harm" }

end:
  say: One loop, one light. The island looks brighter already.
