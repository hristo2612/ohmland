# Blueprint: docs/curriculum/unit-1.md, L11, the second half of the split (docs/curriculum/conversion-guide.md, B3).
# A bench lesson (docs/LESSONS.md). One idea: turn the law round to choose a resistor.
# Lab: content/labs/use-the-law.ts. The sums are this file's number checks; the lab holds the bench work.
format: bench
id: use-the-law
version: 1
title: Predict, then pick
summary: Turn Ohm's law round to work out an LED's resistor, then pick the nearest real one and prove it.
minutes: 6
lab: use-the-law
unlocks:
  parts: []
  isle: meter-kiosk

start:
  title: Predict, then pick
  say: My LED wants 15 mA. Which resistor? No guessing.
  go: Let's work it out

beats:
  - say: Fine, one wild guess. Drop the 4.7 kΩ in.
    objective: Guessing is slow
    do: wild-guess
    done: 1.6 mA. I asked for 15!
    note: { at: D1, text: "1.6 mA: barely awake" }

  - say: The LED takes 2 V of the 9. What's left?
    objective: Do the sums
    number: { answer: 7, unit: V, tolerance: 2 }
    hint: The battery's push minus the LED's share.

  - say: 7 V for the resistor, 15 mA wanted. What resistance?
    number: { answer: 467, unit: Ω, tolerance: 2 }
    hint: Volts divided by milliamps gives kilohms.
    note: { at: H1, text: "V, mA and kΩ go together" }
    rule: R = V ÷ I.

  - say: The nearest real one's in the tray. Drop it in.
    objective: Pick and prove
    do: pick-and-prove
    done: 15.4 mA. Bang on!
    note: { at: R2, text: "470 Ω: nearest real value" }

secret:
  task: ten-k
  say: Curious? Guess the flow through 10 kΩ, then try it.
  done: Under 1 mA. A sleepy glow.
  note: { at: R4, text: "about 0.76 mA" }

fixit:
  say: I picked 47 Ω this time. Fix it before it pops.
  tasks:
    - task: fix-wrong-pick

end:
  say: Work it out, pick it, prove it. Proper engineering.
