# Blueprint: docs/curriculum/unit-1.md, L12, split (docs/curriculum/conversion-guide.md, B3), retitled "Side by side".
# A bench lesson (docs/LESSONS.md) on the half breadboard. One idea: side by side, the total is less than the smallest.
# Lab: content/labs/series-and-parallel.ts. End to end moved to end-to-end.
format: bench
id: series-and-parallel
version: 2
title: Side by side
summary: Put resistors side by side on the breadboard, and find the pair squeezes less than either one alone.
minutes: 7
lab: series-and-parallel
unlocks:
  parts: []
  isle: resistor

start:
  title: Side by side
  say: Two resistors side by side. Bet you can't guess the total.
  go: Take the bet

beats:
  - say: Put R2 beside R1, in the same two strips. Guess first.
    objective: Two paths
    guess: { options: [About 2 kΩ, About 1 kΩ, About 500 Ω], answer: About 500 Ω }
    do: parallel-ohms
    done: Half! Two paths, half the squeeze.
    note: { at: R2, text: "two paths: half the squeeze" }
    rule: "Side by side: less than the smallest."

  - say: Now 1 kΩ beside 3.3 kΩ. Predict the total.
    objective: Predict a pair
    do: predict-pair

  - say: Drop the 3.3 kΩ onto R2. Were you close?
    do: predict-mixed
    note: { at: R3, text: "767 Ω: less than either" }

  - say: "Power on. R1 alone: 9.3 mA. Add R2 back. Guess first."
    objective: Count the flow
    guess: { options: [Halves, Stays the same, Doubles], answer: Doubles }
    do: add-a-branch
    done: 18.4 mA. Twice the flow!
    note: { at: R2, text: each path takes its own flow }

secret:
  task: smallest-wins
  say: Curious? Put the 1 MΩ beside them too.
  done: Barely a flicker. The small paths win.
  note: { at: R4, text: "huge path: almost no flow" }

fixit:
  say: Sam's side-by-side pair reads 2 kΩ. Fix it.
  tasks:
    - task: fix-sams-pair

end:
  say: Less than the smallest. You won the bet.
