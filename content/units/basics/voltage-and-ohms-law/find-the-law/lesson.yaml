# Blueprint: docs/curriculum/unit-1.md, L11, split (docs/curriculum/conversion-guide.md, B3). A bench lesson
# (docs/LESSONS.md). One idea: V = I × R, found in your own data and proved by one prediction.
# Lab: content/labs/find-the-law.ts (it still fires the lawmaker trigger). Turning the law round moved to use-the-law.
format: bench
id: find-the-law
version: 3
title: Find the law yourself
summary: Measure the current through four resistors and discover V = I × R from your own data.
minutes: 9
lab: find-the-law
unlocks:
  parts: []
  isle: meter-kiosk

start:
  title: Find the law
  say: Measure first, formula later. Let's find a law.
  go: Let's measure

beats:
  - say: First, the battery's push. Dial to volts, probes across.
    objective: Know your push
    do: battery-first
    note: { at: B1, text: "9.4 V: remember this" }

  - say: Meter in series, 1 kΩ in the holder. Type the mA.
    objective: Fill the table
    do: first-row
    note: { at: H1, text: "row one: about 9.2 mA" }

  - say: Now 1.5, 2.2 and 3.3 kΩ. Double the squeeze, and the flow...
    guess: { options: [Doubles, Halves, Stays the same], answer: Halves }
    do: fill-the-table
    note: { at: H1, text: "more squeeze, less flow" }

  - say: Multiply each row on the slip. What keeps turning up?
    objective: Spot the pattern
    tool: data
    do: spot-the-pattern
    done: Your battery's push. Every single row!
    note: { at: B1, text: "every row: about 9.4" }
    rule: V = I × R.

  - say: Predict the flow through 4.7 kΩ. Type it first.
    objective: Prove it
    tool: data
    do: predict-4k7

  - say: Now drop it in. Were you right?
    do: predict-and-test
    done: Predicted, then proved. That's what laws are for.
    note: { at: R5, text: "close, never exact" }

fixit:
  say: Row three reads zero now. Fix it.
  tasks:
    - task: fix-red-plug

end:
  say: You found Ohm's law. With your own data!
