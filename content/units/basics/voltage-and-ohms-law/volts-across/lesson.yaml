# Blueprint: docs/curriculum/unit-1.md, L10, split (docs/curriculum/conversion-guide.md, B3). A bench lesson
# (docs/LESSONS.md). One idea: push is measured across a part, with the circuit running.
# Lab: content/labs/volts-across.ts. The drops adding up moved to share-the-push.
format: bench
id: volts-across
version: 2
title: Across, not in
summary: Measure the push across each part of a running circuit, without cutting a thing.
minutes: 6
lab: volts-across
unlocks:
  parts: []
  isle: jumper-arch

start:
  title: Push across
  say: My lamp's lit. Measure its push without cutting a thing?
  go: Grab the meter

beats:
  - say: Red plug's still in mA from last time. Probe like that?
    objective: Safe setup
    guess: { options: [Sure, Pop goes the fuse], answer: Pop goes the fuse }
    do: move-the-plug
    done: It would pop. In mA, the meter is nearly a wire.
    note: { at: "part:M1", text: "VΩ: sips almost nothing" }

  - say: "Now the dial: the V with the straight line."
    do: reset-meter

  - say: Probe across the resistor. Red on the end nearer plus.
    objective: Measure across
    do: resistor-volts
    done: About 7.4 V. And the lamp never blinked.
    note: { at: R1, text: "push: between its two ends" }

  - say: Now across the LED. Red on the long leg.
    do: led-volts
    note: { at: D1, text: about 2 V across }
    rule: Push across. Flow through.

  - say: Quick one. For push, where do the probes go?
    pick: { options: [Across a part, Into a gap], answer: Across a part }
    wrong: { Into a gap: "That's for flow. Push needs no cutting." }

fixit:
  say: My lamp died the moment I measured. Fix it.
  tasks:
    - task: fix-in-gap

end:
  say: Push measured, nothing cut. Tidy work.
