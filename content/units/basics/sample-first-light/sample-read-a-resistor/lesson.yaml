# SAMPLE LESSON. It exists so every step and quiz type renders end to end, and will be replaced by real lessons.
id: sample-read-a-resistor
version: 1
title: "Sample: Read a resistor"
summary: Decode the colour bands, then find your way around the meter's sockets.
minutes: 6
unlocks:
  parts: [multimeter, test-leads]
  isle: sample-meter-kiosk
steps:
  - type: hook
    body: |
      Resistors are too small for printed numbers, so they wear coloured stripes instead.
      Learn ten colours and you can read any resistor at a glance.
    visual: { kind: part, part: resistor }
    mascot: Ten colours. That is the whole code.

  - type: explain
    cards:
      - title: Ten colours, ten digits
        body: |
          Black is 0, brown 1, red 2, orange 3, yellow 4, green 5, blue 6, violet 7, grey 8 and white 9.
          On a four-band resistor the first two bands are digits and the third says how many zeros follow.
          Yellow, violet, red means 4, 7 and two zeros: 4700 Ω, or 4.7 kΩ.
        widget: { kind: resistor-explorer, props: { ohms: 4700 } }
      - title: Which end comes first?
        body: |
          The last band is usually gold or silver. It gives the tolerance: how far the real value may be from
          the printed one. Gold means within 5%. Start reading from the other end. The tolerance band often
          sits a little apart from the rest, which helps too.
      - title: The meter's sockets
        body: |
          A multimeter has a black lead and a red lead. The black one always goes in **COM**, the common socket.
          The red one goes in the socket marked **V Ω mA** for most measurements, and in the one marked
          **10 A** only for big currents.

  - type: quiz
    items:
      - id: read-4k7
        type: color-code
        mode: read
        ohms: 4700
        prompt: What is this resistor's value?
        explain: "Yellow (4), violet (7), red (two zeros): 4700 Ω, which is 4.7 kΩ."

      - id: build-220
        type: color-code
        mode: build
        ohms: 220
        prompt: Build a 220 Ω resistor.
        hint: Two digits, then the number of zeros.
        explain: "Red (2), red (2), brown (one zero): 220 Ω."

      - id: colour-digits
        type: match
        prompt: Match each colour to its digit.
        pairs:
          - { left: Brown, right: "1" }
          - { left: Red, right: "2" }
          - { left: Yellow, right: "4" }
          - { left: Violet, right: "7" }
        explain: From red to violet the digits follow the rainbow, with black and brown before it and grey and white after.

      - id: black-lead
        type: hotspot
        figure: multimeter
        prompt: Where does the black lead plug in?
        answer: com
        explain: The black lead always goes in COM, the common socket. Only the red lead moves between sockets.

      - id: led-cathode
        type: hotspot
        figure: led
        prompt: "Tap the LED's cathode: the leg that goes toward the battery's minus side."
        answer: cathode
        explain: The cathode is the shorter leg, on the side where the rim of the lens is flat.

  - type: wrap
    rules:
      - Read the bands starting from the end opposite the gold or silver band.
      - The first two bands are digits. The third is the number of zeros.
      - The black lead always goes in COM.
