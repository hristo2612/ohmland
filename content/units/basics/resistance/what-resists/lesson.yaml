# Blueprint: docs/curriculum/unit-1.md, L4. A bench lesson (docs/LESSONS.md), split per
# docs/curriculum/conversion-guide.md, B3: this is the kept half (skin); the cups are in salt-and-water.
# One idea: the Ω setting measures squeeze, even your skin's. Lab: content/labs/what-resists.ts.
format: bench
id: what-resists
version: 2
title: What resists?
summary: Turn the dial to Ω and measure your own skin, dry and then wet.
minutes: 6
lab: what-resists
unlocks:
  parts: []
  isle: wire-spool

start:
  title: Your skin resists
  say: Even you resist a little. Let's measure.
  go: Let's measure

beats:
  - say: Probes on the skin. Turn the dial to Ω.
    objective: Dry skin
    tool: meter
    do: dry-skin
    done: Almost a million ohms!
    note: { at: P1, text: "Ω: meter sends a tiny flow" }
    rule: Measure squeeze with the power off.

  - say: It says 0.840 MΩ. How many kΩ is that?
    tool: meter
    number: { answer: 840, unit: kΩ, tolerance: 1 }
    hint: M is a million. k is a thousand.
    note: { at: part:M1, text: "M: mega, a million" }

  - say: Tap Wet on the patch. Guess first.
    objective: Wet skin
    tool: meter
    guess: { options: [more ohms, about the same, fewer ohms], answer: fewer ohms }
    do: wet-skin
    done: About 46 kΩ. Water lets the flow in.
    note: { at: P1, text: "dry 840 kΩ, wet 46 kΩ" }

  - say: Quick one. What does Ω measure?
    pick: { options: [push, flow, squeeze], answer: squeeze, on: part:M1 }
    wrong: { push: "Push is V, volts. Try again.", flow: "Flow is A, amps. Try again." }

secret:
  task: double-spacing
  say: Curious? Move one probe to 4 cm. Double the ohms?
  tool: meter
  done: Up a little. Nowhere near double.
  note: { at: P1, text: contacts do most of it }

fixit:
  say: Fix-it time. Dry skin reads OL. Fix it.
  tool: meter
  tasks:
    - task: fix-dry

end:
  say: You resist. Now you can prove it.
