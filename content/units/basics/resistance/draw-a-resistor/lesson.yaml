# Blueprint: docs/curriculum/unit-1.md, L5. A bench lesson (docs/LESSONS.md), trimmed per
# docs/curriculum/conversion-guide.md, B3. One idea: a line's shape sets its squeeze (longer more, thicker less).
# Lab: content/labs/draw-a-resistor.ts.
format: bench
id: draw-a-resistor
version: 2
title: Draw a resistor
summary: Draw a pencil line, measure it, and find out what length and shading do to its resistance.
minutes: 8
lab: draw-a-resistor
unlocks:
  parts: [pencil-line]
  isle: pot

start:
  title: Draw a resistor
  say: Grab the pencil. Today we draw electronics.
  go: Grab the pencil

beats:
  - say: Draw a line from 0 to 5 cm.
    objective: Draw a line
    do: draw-line

  - say: Now probe both ends.
    tool: meter
    do: first-line
    done: About 100 kΩ. You drew a resistor!
    note: { at: P1, text: "graphite: a resistor you draw" }

  - say: Slide one probe to the middle. Guess first.
    tool: meter
    guess: { options: [about half, about double, the same], answer: about half }
    do: half-way
    done: "About half: 52 kΩ."
    note: { at: P1.p5, text: "half the length, half the ohms" }

  - say: Shade the line again. Then probe end to end.
    objective: Go darker
    tool: meter
    guess: { options: [more ohms, the same, fewer ohms], answer: fewer ohms }
    do: go-darker
    done: Lower. More graphite, more room.
    rule: "Longer: more squeeze. Thicker: less."

  - say: Your design now. Make it read 30 kΩ.
    objective: Hit a target
    tool: meter
    do: hit-target
    done: On target!

  - say: Quick one. Which line squeezes least?
    pick: { options: [short and dark, long and light, long and dark], answer: short and dark }
    wrong: { long and light: "That one squeezes most of all.", long and dark: "Dark helps. Long doesn't." }

secret:
  task: slide-along
  say: Curious? Slide one probe slowly along the line.
  tool: meter
  done: It climbs as you slide.
  note: { at: P1, text: "a sliding contact: a potentiometer" }

fixit:
  say: Fix-it time. My line reads OL. Fix it.
  tool: meter
  tasks:
    - task: fix-line

end:
  say: You drew a working resistor. Art class meets physics.
