# Blueprint: docs/curriculum/unit-1.md, L6. A bench lesson (docs/LESSONS.md), split per
# docs/curriculum/conversion-guide.md, B3: this is the kept half (the code); measuring and tolerance are in the-liar.
# One idea: two digit stripes, then the number of zeros. Lab: content/labs/reading-the-stripes.ts.
format: bench
id: reading-the-stripes
version: 2
title: Reading the stripes
summary: Crack the resistor colour code with a chart, then label a bag of resistors by their stripes alone.
minutes: 6
lab: reading-the-stripes
unlocks:
  parts: []
  isle: resistor

start:
  title: Crack the stripes
  say: Resistors wear stripes, not numbers. Let's crack the code.
  go: Crack it

beats:
  - say: Yellow, violet, brown. Use the chart. How many ohms?
    objective: Crack one
    spot: [CH1]
    do: decode-yellow
    done: 470 Ω. Code cracked!
    note: { at: CH1, text: "4, 7, then one zero" }
    rule: Gold on the right. Digits, then zeros.

  - say: Now label all five. Stripes only.
    objective: Sort the bag
    do: sort-the-bag
    done: Five for five.

  - say: Quick one. Which end do you read from?
    pick: { options: [the gold end, the other end], answer: the other end, on: R3 }
    wrong: { the gold end: "Gold goes on the right. Start from the left." }

  - say: And what does the third stripe count?
    pick: { options: [a third digit, the zeros], answer: the zeros }
    wrong: { a third digit: "Only two digits here. Look at brown." }

secret:
  task: tiny-gold
  say: Curious? This one has gold in third place.
  done: 4.7 Ω. Gold there divides by ten.
  note: { at: R6, text: "gold third: divide by ten" }

fixit:
  say: Fix-it time. Two labels lie about their stripes.
  tasks:
    - task: fix-labels

end:
  say: Stripes cracked. No meter needed.
