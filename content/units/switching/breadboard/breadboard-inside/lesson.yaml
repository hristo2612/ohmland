# Blueprint: docs/curriculum/unit-2.md, Lesson 7; conversion: docs/curriculum/conversion-guide.md, C2 lesson 7.
# A bench lesson (docs/LESSONS.md). One idea: parts with two rows of legs straddle the middle gap.
# Lab: content/labs/breadboard-inside.ts. The strips themselves are taught in how-a-breadboard-works.
format: bench
id: breadboard-inside
version: 2
title: The full board
summary: Move a relay onto the big board across its middle gap, then wake up a dead half.
minutes: 7
lab: breadboard-inside
unlocks:
  parts: [jumper-wires]
  isle: breadboard-patch

start:
  title: The full board
  say: A bigger board, same strips. My relay won't click, though.
  go: Let's look

beats:
  - say: Press the button. Listen for the click.
    objective: Wake the relay
    spot: [S1, K1]
    do: dud-press
    done: Not one click.
    note: { at: K1, text: facing legs share a strip }

  - say: X-ray on. Slide the relay so it straddles the gap.
    xray: true
    spot: [K1, D5]
    do: relay-straddles
    done: There. Every leg, its own strip.
    note: { at: K1, text: one row each side }

  - say: Press the button again.
    spot: [S1, D6]
    do: relay-on-board
    done: Click! Green.
    rule: Two-row parts straddle the gap.

  - say: Which other part straddles the gap? Tap it.
    objective: Spot the pattern
    tap: { answer: S1, among: [S1, R4, D6] }
    wrong:
      R4: "One row of legs. Look for four."
      D6: "Two legs, one row. Look for four."
    note: { at: S1, text: "four legs, two rows" }

fixit:
  say: Fix-it time. Half my board went dark. Why?
  tasks:
    - task: bus-gap

end:
  say: Big board, same rules. You read it like a map.
