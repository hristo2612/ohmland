# Blueprint: docs/curriculum/unit-2.md, Lesson 8; conversion: docs/curriculum/conversion-guide.md, C2 lesson 8.
# A bench lesson (docs/LESSONS.md). One idea: a relay fed through its own NC contact switches itself on and off.
# Lab: content/labs/relay-buzzer.ts. The capacitor that slows the buzz is the next lesson, tame-the-buzz.
format: bench
id: relay-buzzer
version: 2
title: It buzzes itself
summary: Feed a relay's coil through its own NC contact and it switches itself on and off, many times a second.
minutes: 5
lab: relay-buzzer
unlocks:
  parts: []
  isle: jumper-arch

start:
  title: It buzzes itself
  say: One wire turns this polite relay into a buzzer.
  go: Let's buzz

beats:
  - say: Power on with S2. Press S1, then let go.
    objective: A polite relay
    spot: [S2, S1, K1]
    do: polite-click
    done: Click in, click out. Very polite.

  - say: Now wire NC, row 16, to the coil, row 11.
    objective: Make it buzz
    guess: { options: [Click and stay, Never click, Click on and off], answer: Click on and off }
    do: move-one-wire
    done: It's alive! And a bit annoying.
    note: { at: K1, text: "pull in, lose power, let go" }
    rule: "Coil fed through its own NC: a buzz."

  - say: Both lamps glow at once. How?
    pick: { options: [Too fast to see, Both contacts close], answer: Too fast to see }
    wrong:
      Both contacts close: "Never both at once. It swaps, very fast."
    note: { at: D2, text: "on, off, 80 times a second" }

  - say: Quick, switch off. Buzzing wears the contacts out.
    spot: [S2]
    do: switch-off
    note: { at: K1, text: every spark wears the contacts }

fixit:
  say: Fix-it time. Power's on, but my buzzer just sits there.
  tasks:
    - task: fix-the-feed

end:
  say: You built the beating heart of an old doorbell.
