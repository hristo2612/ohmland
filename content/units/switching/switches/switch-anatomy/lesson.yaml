# Blueprint: docs/curriculum/unit-2.md, Lesson 1; conversion: docs/curriculum/conversion-guide.md, C2 (1).
# A bench lesson (docs/LESSONS.md). One idea: a switch's pole moves between its throws.
# Lab: content/labs/switch-anatomy.ts. Normally open and normally closed buttons moved to two-buttons.
format: bench
id: switch-anatomy
version: 2
title: Poles and throws
summary: Probe a slide switch in both positions and find the leg that moves.
minutes: 6
lab: switch-anatomy
unlocks:
  parts: [toggle-switch, slide-switch]
  isle: switch

start:
  title: Poles and throws
  say: Three legs, one slider. Which leg does the moving?
  go: Grab the probes

beats:
  - say: Beep check. Dial to Beep, then touch the tips.
    objective: Warm up the beeper
    tool: meter
    do: beep-test

  - say: Probe S2's three pairs, both positions. Who changes partner?
    objective: Find the pole
    guess: { options: [The left leg, The middle leg, The right leg], answer: The middle leg }
    do: find-the-pole
    done: The middle leg. It swaps partners at every slide.
    note: { at: S2.com, text: "pole: the moving contact" }
    rule: The pole moves. The throws stay put.

  - say: Show me the pole.
    tap: { answer: S2.com, among: [S2.a, S2.com, S2.b] }
    wrong:
      S2.a: That end beeps in one position only.
      S2.b: That end beeps in one position only.

  - say: S2 has one pole. How many throws?
    pick: { on: S2, options: ["One", "Two", "Three"], answer: "Two" }
    wrong:
      "One": Count the places the pole can land.
      "Three": The pole itself isn't a throw.
    note: { at: S2, text: "SPDT: one pole, two throws" }

secret:
  task: one-throw
  say: Curious? S1 has only two legs. Probe it both ways.
  done: Silence, then a beep. Just on or off.
  note: { at: S1, text: "SPST: one pole, one throw" }

fixit:
  say: My selector lights one lamp only. Fix it.
  tasks:
    - task: fix-selector

end:
  say: Poles and throws. You can read any switch now.
