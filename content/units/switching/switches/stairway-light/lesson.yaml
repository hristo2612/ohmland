# Blueprint: docs/curriculum/unit-2.md, Lesson 3; conversion: docs/curriculum/conversion-guide.md, C2 (3).
# A bench lesson (docs/LESSONS.md). One idea: with two travellers, either switch toggles the lamp.
# Lab: content/labs/stairway-light.ts. Switches in series moved to both-switches.
format: bench
id: stairway-light
version: 2
title: Either switch
summary: Join two changeover switches with two travellers so either one flips the same lamp.
minutes: 7
lab: stairway-light
unlocks:
  parts: []
  isle: led-lamp

start:
  title: Either switch
  say: One stair lamp. A switch at the bottom, one at the top.
  go: Let's wire

beats:
  - say: Join the throws. A1 to B1, then A2 to B2.
    objective: Two travellers
    spot: [SA, SB]
    do: wire-travelers
    note: { at: SA, text: "two roads; the poles pick one" }

  - say: Try all four flips. Does every single flip work? Guess first.
    guess: { options: [Every flip, Only some], answer: Every flip }
    do: two-travelers
    done: Every flip. Upstairs or down, any time.
    note: { at: D1, text: "on when they match" }
    rule: Any single flip toggles the lamp.

  - say: Lamp on. Flip upstairs, then downstairs. Now?
    pick: { options: ["On", "Off"], answer: "On" }
    wrong: { "Off": "Two flips, two toggles. Back where it began." }

  - say: Cross the travellers at B. Then flip through all four.
    objective: Cross them
    guess: { options: [It breaks, Still a stairway], answer: Still a stairway }
    do: cross-the-travelers
    done: Still a stairway. Now different means on.
    note: { at: D1, text: "on when they differ" }

  - say: Crossed now. A on A1, B on B1. Lamp?
    pick: { options: ["On", "Off"], answer: "Off" }
    wrong: { "On": "Crossed, matching switches mean off. Check the table." }

fixit:
  say: The top switch only works half the time. Fix it.
  tasks:
    - task: fix-traveler

end:
  say: Upstairs, downstairs, any switch, any time. Nice wiring.
