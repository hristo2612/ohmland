# Split from switch-anatomy (docs/curriculum/conversion-guide.md, C2 1b). A bench lesson (docs/LESSONS.md).
# One idea: a normally open button joins while pressed; a normally closed one breaks while pressed.
# Lab: content/labs/two-buttons.ts (press-and-hold moved here from switch-anatomy).
format: bench
id: two-buttons
version: 1
title: Press or release
summary: Probe two identical-looking buttons, released and held, and tell normally open from normally closed.
minutes: 5
lab: two-buttons
unlocks:
  parts: [pushbutton]
  isle: pushbutton

start:
  title: Press or release
  say: Two buttons, identical twins. Inside, are they opposites?
  go: Let's probe

beats:
  - say: Probe S3. Then hold it down and probe again.
    objective: Test the twins
    spot: [S3]
    do: probe-s3
    done: Silence, then a beep. It joins while pressed.
    note: { at: S3, text: "normally open: joins when pressed" }

  - say: Now S4, released and held. Guess first.
    spot: [S4]
    guess: { options: [Same as S3, The opposite], answer: The opposite }
    do: probe-s4
    done: Beep, then silence. The opposite!
    note: { at: S4, text: "normally closed: breaks when pressed" }
    rule: NO joins when pressed. NC breaks.

  - say: Tag each button. Both spring back when you let go.
    objective: Name them
    do: press-and-hold

  - say: A doorbell button. Which kind?
    pick: { options: [Normally open, Normally closed], answer: Normally open }
    wrong: { Normally closed: "Then it would ring until pressed. Noisy!" }

  - say: The closing fridge door presses a button. Light off. Which kind?
    pick: { options: [Normally open, Normally closed], answer: Normally closed }
    wrong: { Normally open: "Then the light would come on as the door shuts." }

fixit:
  say: My doorbell lamp glows all day. Fix it.
  tasks:
    - task: fix-doorbell

end:
  say: Press or release. You can tell the twins apart now.
