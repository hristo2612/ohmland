# Blueprint: docs/curriculum/unit-2.md, Lesson 2; conversion: docs/curriculum/conversion-guide.md, C2 (2).
# A bench lesson (docs/LESSONS.md). One idea: test every pair in every position, and the pattern names the legs.
# Lab: content/labs/mystery-switch.ts. Symbols and dots are taught in Start here; the clean-map bonus keeps the
# pin-sleuth trigger.
format: bench
id: mystery-switch
version: 2
title: The mystery switch
summary: Map an unlabeled six-legged switch from continuity alone, then peek inside to check.
minutes: 7
lab: mystery-switch
unlocks:
  parts: []
  isle: test-lead-arch

start:
  title: The mystery switch
  say: Six legs, no labels. Let the beeps do the talking.
  go: Let's crack it

beats:
  - say: Probe every pair, both slider positions. How many pairs? Guess first.
    objective: Map every pair
    spot: [SW]
    guess: { options: ["6", "15", "36"], answer: "15" }
    do: map-pairs
    done: Fifteen pairs. Two beep in each position.
    note: { at: SW, text: "15 pairs, each tested once" }

  - say: Name every terminal in the pin map. Then check.
    objective: Name the legs
    do: name-the-legs
    done: Two poles, two throws each. A DPDT!
    rule: A pole changes partners. A throw doesn't.

  - say: Now peek inside. Were the beeps right?
    do: peek-inside
    note: { at: SW, text: "P: pole, T: throw" }

  - say: One terminal beeps with a new partner each slide. It's a...
    pick: { options: [Pole, Throw], answer: Pole }
    wrong: { Throw: "A throw beeps in one position only." }

secret:
  task: draw-it
  say: Curious? Build its symbol in the panel.
  done: Two levers, one dashed line.
  note: { at: SW, text: "dashed: one slider, two circuits" }

fixit:
  say: My lamp won't light, either way. Fix it.
  tasks:
    - task: fix-lamp

end:
  say: Cracked by beeps alone. A detective would be proud.
