# Split from stairway-light (docs/curriculum/conversion-guide.md, C2 3a). A bench lesson (docs/LESSONS.md).
# One idea: two switches in series light the lamp only when both are on.
# Lab: content/labs/both-switches.ts (series-pair moved here from stairway-light).
format: bench
id: both-switches
version: 1
title: Both must agree
summary: Put two switches in series with a lamp and find the one combination that lights it.
minutes: 5
lab: both-switches
unlocks:
  parts: []
  isle: switch

start:
  title: Both must agree
  say: One lamp, two switches. Who's the boss?
  go: Let's wire

beats:
  - say: Clip a lead from A's free screw to B's.
    objective: Wire the pair
    spot: [SA, SB]
    do: link-ab

  - say: Now try all four flips. How many light it? Guess first.
    guess: { options: [One of four, Two of four, Three of four], answer: One of four }
    do: series-pair
    done: Only both on. One road, two gates.
    note: { at: D1, text: "lit only when both are on" }
    rule: In series, both must close.

  - say: A is on, B is off. Is the lamp on?
    objective: Think it through
    pick: { options: ["Yes", "No"], answer: "No" }
    wrong: { "Yes": "B is a gap in the same road. Nothing gets past." }

  - say: Add a third switch in series. How many combos light it?
    pick: { options: [One of eight, Three of eight, Seven of eight], answer: One of eight }
    wrong:
      Three of eight: All three must close. That happens once.
      Seven of eight: That's side by side. In series, all must close.

secret:
  task: either-one
  say: Curious? Wire them side by side instead.
  done: Now either one does it.
  note: { at: D1, text: "side by side: either one" }

fixit:
  say: My safety lamp lights with one switch. Fix it.
  tasks:
    - task: fix-safety

end:
  say: Both must agree. Safety machines love this trick.
