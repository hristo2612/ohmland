# Blueprint: docs/curriculum/unit-2.md, Lesson 17; docs/curriculum/conversion-guide.md, 17 (trimmed).
# A bench lesson (docs/LESSONS.md). One idea: two transistors cross-coupled by capacitors take turns forever.
# Lab: content/labs/twin-flasher.ts.
format: bench
id: twin-flasher
version: 2
title: The twin blinker
summary: Build two transistors that switch each other off in turn, an LED flasher with no moving parts.
minutes: 9
lab: twin-flasher
unlocks:
  parts: []
  isle: led-lamp

start:
  title: The twin blinker
  say: Two lamps for my tower. They should take turns.
  go: Let's build

beats:
  - say: Feed each base, 68 kΩ from its + rail. Power on.
    objective: Two switches
    do: bases-up
    note: { at: D1, text: "two switches, both just on" }

  - say: Cross two 10 µF, collector to other base. Guess first.
    objective: Make them talk
    guess: { options: [Both stay on, They take turns, Both go dark], answer: They take turns }
    do: cross-couple
    note: { at: C1, text: "one on kicks the other off" }
    rule: Cross-coupled, they take turns.

  - say: Scope on. Yellow is Q2's base. How low? Guess first.
    tool: scope
    guess: { options: [Down to 0 V, Below 0 V], answer: Below 0 V }
    do: look-inside
    note: { at: Q2.b, text: "down to −7 V, then back" }

  - say: Q1 switches on. What happens to Q2?
    tool: scope
    pick: { options: [It turns on too, It gets kicked off, Nothing at all], answer: It gets kicked off }
    wrong: { It turns on too: "Watch yellow when Q1 switches on.", Nothing at all: "Its base gets yanked down. Watch yellow." }

secret:
  task: one-cap
  say: Curious? Pull one capacitor out.
  done: Both just stare. No kick, no turns.
  note: { at: D1, text: "no cross, no turns" }

fixit:
  say: Fix-it time. Too fast for my tower. Make it 2 s.
  tasks:
    - task: slow-it-down

end:
  say: Two lamps, taking turns forever. No clicks, no wear.
