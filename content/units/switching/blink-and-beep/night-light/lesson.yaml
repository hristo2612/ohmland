# Blueprint: docs/curriculum/unit-2.md, Lesson 16; docs/curriculum/conversion-guide.md, 16 (trimmed).
# A bench lesson (docs/LESSONS.md). One idea: a light sensor that steals a transistor's base flow makes a lamp that
# lights in the dark. Lab: content/labs/night-light.ts.
format: bench
id: night-light
version: 2
title: Lights on at dusk
summary: Use a phototransistor to sense light, then flip its logic so a lamp turns on as darkness falls.
minutes: 8
lab: night-light
unlocks:
  parts: [phototransistor]
  isle: phototransistor

start:
  title: Lights on at dusk
  say: Street lamps wake at dusk by themselves. Teach mine?
  go: Let's start

beats:
  - say: This is a phototransistor. Tap it.
    meet: PT1
    note: { at: PT1, text: phototransistor }

  - say: Slide the lamp from dark to bright. Watch the red LED.
    objective: A light valve
    tool: controls
    do: follow-the-light
    note: { at: PT1, text: "more light, more flow" }

  - say: How many legs does it have?
    pick: { on: PT1, options: [Two, Three], answer: Two }
    wrong: { Three: "Count again. Light does the base's job." }
    note: { at: PT1, text: "light does the base's job" }

  - say: Plug PT2 into strips 30 and 31, across Q1's base.
    objective: Flip it
    do: plug-pt2

  - say: Now dark, then bright. Watch yellow. Guess first.
    tool: controls
    guess: { options: [On in the light, On in the dark], answer: On in the dark }
    do: flip-it
    note: { at: D2, text: "dark: on. light: off." }
    rule: In light, the sensor steals the base flow.

  - say: Last one. What is this?
    pick: { on: PT2, options: [A phototransistor, An LED, A resistor], answer: A phototransistor }

fixit:
  say: Fix-it time. My lamp only wakes in pitch dark. Why?
  tool: controls
  tasks:
    - task: set-dusk

end:
  say: Dusk detected, lamp deployed. Switchback Isle glows tonight.
