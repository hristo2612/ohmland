# Blueprint: docs/curriculum/unit-2.md, Lesson 19, the unit's landmark build; docs/curriculum/conversion-guide.md, 19.
# A bench lesson (docs/LESSONS.md). One idea: a slow oscillator nudging a fast one moves the pitch; a capacitor turns
# the steps into a wail. Lab: content/labs/siren.ts. Any speaker holding 440 Hz still fires speaker-concert-a.
format: bench
id: siren
version: 2
title: The siren button
summary: Let the slow flasher steer the fast tone into a two-tone siren, then smooth it into a wail. The unit's landmark build.
minutes: 10
lab: siren
unlocks:
  parts: []
  isle: pushbutton

start:
  title: The siren button
  say: Blinks and beeps. Now give the island a voice.
  go: Let's hear it

beats:
  - say: Hold the siren button. A blink, and a steady tone.
    objective: Two voices
    tool: scope
    do: two-voices
    note: { at: SP1, text: "steady: about 1.2 kHz" }

  - say: Bridge with two 100 kΩ, fast bases to row 16. Guess first.
    objective: Introduce them
    tool: scope
    guess: { options: [One steady tone, Two tones in turn, Silence], answer: Two tones in turn }
    do: bridge
    note: { at: SP1, text: "1.36 to 1.85 kHz: nee-naw" }
    rule: Join circuits gently, through resistors.

  - say: Make it glide. R10 and C5 go between Q1 and the bridge.
    objective: Make it wail
    tool: scope
    do: wail
    note: { at: C5, text: "steps become slopes" }

  - say: So what does C5 do?
    pick: { options: [Sets the pitch, Smooths the steps, Guards the speaker], answer: Smooths the steps }
    wrong: { Sets the pitch: "The 10 nF beads set the pitch.", Guards the speaker: "That's R12's job." }

secret:
  task: trill
  say: Curious? 1 µF beads for C1 and C2. C5 out.
  tool: scope
  done: A frantic trill!
  note: { at: SP1, text: "small caps: a fast warble" }

fixit:
  say: Fix-it time. My siren sounds muddy. Why?
  tool: scope
  tasks:
    - task: fix-muddy

end:
  say: Nee-naw! Switchback Isle can call the whole archipelago.
