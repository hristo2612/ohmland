# Blueprint: docs/curriculum/unit-2.md, Lesson 18; docs/curriculum/conversion-guide.md, 18 (trimmed).
# A bench lesson (docs/LESSONS.md). One idea: shrink the capacitors and the blink speeds up until it is a tone.
# Lab: content/labs/flasher-to-tone.ts. The ceramic code (taken from capacitor-labels) is a pick check here.
format: bench
id: flasher-to-tone
version: 2
title: Shrink it to a song
summary: Shrink the flasher's capacitors step by step until the blink becomes a buzz, a hum and finally a tone.
minutes: 9
lab: flasher-to-tone
unlocks:
  parts: [speaker]
  isle: speaker

start:
  title: Shrink it to a song
  say: Same flasher, plus a speaker. Let's make it sing.
  go: Let's listen

beats:
  - say: This is a speaker. Tap it.
    meet: SP1
    note: { at: SP1, text: speaker }

  - say: Slide the power on. Sound on, too. Listen.
    objective: Tick, tock
    do: tick-tock
    note: { at: SP1, text: "a click each time Q3 switches" }

  - say: "Bead code: two digits, then zeros, in pF. Which is 1 µF?"
    objective: Faster and faster
    pick: { options: ["103", "104", "105"], answer: "105" }
    wrong: { "103": "103 is 10,000 pF. That's 10 nF.", "104": "104 is 100,000 pF. That's 100 nF." }

  - say: Swap both caps for the 105 beads. Same places.
    tool: scope
    do: flutter
    note: { at: SP1, text: "about 10 flips a second" }

  - say: Now the 104s. Guess first. The blinking?
    tool: scope
    guess: { options: [Even faster, A steady glow], answer: A steady glow }
    do: hum
    note: { at: D1, text: "too fast to see: steady" }

  - say: Last, the 103s. Listen.
    objective: Make it sing
    tool: scope
    do: song
    note: { at: SP1, text: "1,260 flips a second: 1.26 kHz" }
    rule: Smaller capacitors, higher pitch.

  - say: What is this?
    pick: { on: SP1, options: [A speaker, A relay, A battery], answer: A speaker }

secret:
  task: lopsided
  say: Curious? Mix one 104 with one 103.
  tool: scope
  done: A new note, in between.
  note: { at: SP1, text: "each cap times its half" }

fixit:
  say: Fix-it time. My speaker is silent. Why?
  tasks:
    - task: fix-speaker

end:
  say: Blink, flicker, hum, sing. Same circuit, smaller caps.
