# Blueprint: docs/curriculum/unit-2.md, Lesson 14; docs/curriculum/conversion-guide.md, 14 (split, the kept half).
# A bench lesson (docs/LESSONS.md). One idea: two transistors chained multiply their gain, enough for a fingertip.
# Lab: content/labs/touch-switch.ts. Saturation is the lesson before, all-the-way-on.
format: bench
id: touch-switch
version: 2
title: Fingertip switch
summary: Light an LED with a fingertip on two touch pads, then chain a second transistor for a feather touch.
minutes: 7
lab: touch-switch
unlocks:
  parts: [touch-pads]
  isle: heatsink

start:
  title: Fingertip switch
  say: Your skin conducts a little. Is a little enough?
  go: Let's touch

beats:
  - say: These are touch pads. Tap them.
    meet: T1
    note: { at: T1, text: touch pads }

  - say: Touch lightly, then press firmly. Watch the LED.
    objective: One transistor
    tool: controls
    do: touch-it
    note: { at: D1, text: "light touch: barely glows" }

  - say: Meet Q2. Move R5's far leg to its base.
    objective: Two in a chain
    spot: [R5, Q2]
    do: feed-q2
    note: { at: Q2, text: "Q2 feeds Q1's base" }

  - say: Now the lightest touch. Guess first.
    tool: controls
    guess: { options: [Barely glows, Full light], answer: Full light }
    do: darlington
    note: { at: Q2, text: "gains multiply: 200 × 200" }
    rule: Chained transistors multiply their gains.

  - say: Gains of 150 and 200, chained. Total gain?
    pick: { options: ["350", "3,000", "30,000"], answer: "30,000" }
    wrong: { "350": "Gains multiply. They don't add.", "3,000": "Close. Count the zeros again." }

fixit:
  say: Fix-it time. My touch lamp never lights. Why?
  tool: controls
  tasks:
    - task: fix-emitter

end:
  say: A feather touch, a full light. Forty thousand times gain!
