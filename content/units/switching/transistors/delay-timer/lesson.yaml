# Blueprint: docs/curriculum/unit-2.md, Lesson 15; docs/curriculum/conversion-guide.md, 15 (split, the kept half).
# A bench lesson (docs/LESSONS.md). One idea: a load that drains the timing capacitor ruins the timer; a transistor
# buffer fixes it. Lab: content/labs/delay-timer.ts. Tuning the delay is the next lesson, tune-the-timer.
format: bench
id: delay-timer
version: 2
title: Wait for it
summary: Find out why a capacitor can't drive a relay coil by itself, and let a transistor carry the load.
minutes: 7
lab: delay-timer
unlocks:
  parts: []
  isle: pot

start:
  title: Wait for it
  say: Flip a switch, wait, click. Mine never clicks.
  go: Let's see

beats:
  - say: Switch on S1. Guess first. When does it click?
    objective: Why no click?
    tool: stopwatch
    guess: { options: [In a second, After a while, Never], answer: Never }
    do: no-click
    done: Ten seconds. Not a peep.

  - say: Probe C1. What does it read?
    tool: meter
    number: { answer: 3.17, unit: V, tolerance: 5 }
    hint: Red on C1's long leg, black on its stripe.
    note: { at: C1, text: "drained by the coil: 3 V" }

  - say: Pull the yellow jumper. Plug Q1 into strips 20 to 22.
    objective: Add a buffer
    do: buffer-in
    done: Click!
    note: { at: Q1, text: "C1 feeds only the base" }

  - say: Now a fair run. S1 off, reset, then on.
    tool: stopwatch
    do: add-q1
    note: { at: K1, text: "click after about 1.5 s" }

  - say: Red on Q1's base, black on its emitter. Reading?
    tool: meter
    number: { answer: 0.74, unit: V, tolerance: 10 }
    hint: Base is strip 21, emitter strip 20. Keep S1 on.
    rule: The emitter follows the base, 0.7 V lower.

secret:
  task: impatient-restart
  say: Curious? Off and straight back on. No reset.
  tool: stopwatch
  done: Barely a wait. C1 was still full.
  note: { at: C1, text: "start empty for a full wait" }

fixit:
  say: Fix-it time. My timer never clicks. Why?
  tasks:
    - task: fix-bypass

end:
  say: Click, every time. Next, we tune the wait.
