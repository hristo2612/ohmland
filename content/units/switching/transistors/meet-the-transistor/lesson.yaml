# Blueprint: docs/curriculum/unit-2.md, Lesson 13; docs/curriculum/conversion-guide.md, 13 (split, the kept half).
# A bench lesson (docs/LESSONS.md). One idea: a trickle into the base lets a big flow through.
# Lab: content/labs/meet-the-transistor.ts. Measuring the gain is the next lesson, count-the-gain.
format: bench
id: meet-the-transistor
version: 2
title: A tiny current in charge
summary: Plug in a 2N3904 the right way round and steer an LED with a trickle of base current.
minutes: 7
lab: meet-the-transistor
unlocks:
  parts: [npn-transistor]
  isle: transistor

start:
  title: A tiny current in charge
  say: No clicks, no wear. Meet my favourite crumb.
  go: Show me

beats:
  - say: This is a transistor. Plug it into strips 20 to 22.
    objective: Plug it in
    do: place-q1
    note: { at: Q1, text: "flat face: E, B, C" }

  - say: Show me its base.
    tap: { answer: Q1.b, among: [Q1.e, Q1.b, Q1.c] }
    wrong: { Q1.e: "That's E, the emitter. Try its neighbour.", Q1.c: "That's C, the collector. Try the middle." }
    note: { at: Q1.b, text: "base: the control leg" }

  - say: Press S1. The base gets 18 µA. And the LED?
    objective: Small steers big
    guess: { options: [About 18 µA, A few mA, Several amps], answer: A few mA }
    do: small-steers-big
    note: { at: D1, text: "3.6 mA: 200 times more" }
    rule: A small base flow steers a big one.

  - say: Where does the LED's flow come from?
    pick: { options: [The battery, The transistor, The base], answer: The battery }
    wrong: { The transistor: "It only opens the way. It makes nothing.", The base: "The base only sets how much." }
    note: { at: B1, text: "battery pushes, Q1 decides" }

  - say: Last one. What is this?
    pick: { on: Q1, options: [A transistor, A resistor, A switch], answer: A transistor }

secret:
  task: no-resistor
  say: Curious? Jumper past the base resistor. Press S1.
  done: Fried. Nothing held the base flow back.
  note: { at: Q1, text: "the base needs its resistor" }

fixit:
  say: Fix-it time. Press S1. Why so dim?
  tasks:
    - task: fix-backwards

end:
  say: A trickle in, a river out. You run transistors now.
