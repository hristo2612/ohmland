# Blueprint: docs/curriculum/unit-2.md, Lesson 9; conversion: docs/curriculum/conversion-guide.md, C2 lesson 9.
# A bench lesson (docs/LESSONS.md). One idea: through a resistor, a capacitor fills and empties gradually.
# Lab: content/labs/capacitor-fill-fade.ts.
format: bench
id: capacitor-fill-fade
version: 2
title: Fill it, watch it fade
summary: Fill a capacitor through a resistor, watch an LED fade as it empties, then dump it in a blink.
minutes: 7
lab: capacitor-fill-fade
unlocks:
  parts: []
  isle: capacitor

start:
  title: Fill it, watch it fade
  say: This capacitor holds what you give it. Let's fill it.
  go: Fill it

beats:
  - say: Hold the red button. Watch the LED.
    objective: Fill and fade
    spot: [S1, D1]
    do: fill
    done: It crept up, slow and steady.
    note: { at: C1, text: "µF: a millionth of a farad" }

  - say: Fill it once more, then let go. Guess first.
    spot: [D1, C1]
    guess: { options: [Out at once, Fades away, Flickers], answer: Fades away }
    do: fade
    done: C1 kept it lit all by itself.
    rule: A capacitor gives back what you put in.

  - say: While it filled, did charge cross C1's gap?
    pick: { on: C1, options: ["Yes, right through", "No, never"], answer: "No, never" }
    wrong:
      "Yes, right through": "It piles up on one plate. The gap stays shut."
    note: { at: C1, text: nothing crosses the gap }

  - say: Fill it again, then press the black button.
    objective: Empty it fast
    spot: [S1, S2, D1]
    do: dump
    done: Gone in a blink.
    note: { at: R3, text: "100 Ω: the fast way out" }

fixit:
  say: Fix-it time. My LED won't fade any more. Why?
  tasks:
    - task: lift-a-leg

end:
  say: Fill, fade, dump. A sunset in a little can.
