# Blueprint: docs/curriculum/unit-2.md, Lesson 11; conversion: docs/curriculum/conversion-guide.md, C2 lesson 11.
# A bench lesson (docs/LESSONS.md). One idea: τ = R × C sets how fast a capacitor fills and empties.
# Lab: content/labs/rc-time-constant.ts. Each τ is typed into the task's notebook box and judged against this
# circuit's own parts; all four within 5% fire the tau-tamer trigger.
format: bench
id: rc-time-constant
version: 2
title: Counting in taus
summary: Log a capacitor filling and emptying, time its 63% mark, and predict timing with τ = R × C.
minutes: 9
lab: rc-time-constant
unlocks:
  parts: [logger]
  isle: resistor

start:
  title: Counting in taus
  say: Every capacitor fills the same way. Let's time one.
  go: Time it

beats:
  - say: Slide S1 to charge. How long to fill? Guess.
    objective: Find tau
    tool: logger
    guess: { options: [About 1 s, About 2 s, It keeps slowing], answer: It keeps slowing }
    do: charge-it
    done: Fast, then slower and slower.

  - say: Drag the cursor to 5.69 V. Type its time.
    tool: logger
    do: find-tau
    done: "About one second: 1 kΩ × 1,000 µF."
    note: { at: C1, text: "one τ: 63% of the way" }
    rule: τ = R × C, in seconds.

  - say: Slide S1 back. When does it fall to 3.31 V?
    tool: logger
    do: discharge-tau
    note: { at: C1, text: same τ going down }

  - say: Swap R1 for the 10 kΩ. Guess τ, then time it.
    objective: Stretch it
    tool: logger
    guess: { options: [About 1 s, About 10 s, About 100 s], answer: About 10 s }
    do: ten-times-slower
    note: { at: R4, text: "10× the R, 10× the time" }

  - say: Double R and halve C. Filling gets...
    pick: { options: [Twice as slow, The same, Twice as fast], answer: The same }
    wrong:
      Twice as slow: "Halving C cancels it. R × C hasn't changed."
      Twice as fast: "Doubling R cancels it. R × C hasn't changed."

  - say: Quick sum. τ for 47 kΩ and 22 µF?
    number: { answer: 1.034, unit: s, tolerance: 2 }
    hint: "47,000 × 0.000022, in seconds."

fixit:
  say: Fix-it time. This timer should take 2.2 s.
  tool: logger
  tasks:
    - task: hit-the-target

end:
  say: Same curve, different stretch. You count in taus now.
