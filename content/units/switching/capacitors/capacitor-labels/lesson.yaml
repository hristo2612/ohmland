# Blueprint: docs/curriculum/unit-2.md, Lesson 10; conversion: docs/curriculum/conversion-guide.md, C2 lesson 10.
# A bench lesson (docs/LESSONS.md). One idea: an electrolytic has a minus stripe and a voltage limit, and fails when
# you ignore them. The ceramic and blocking moved to kick-it-through, the three-digit code to flasher-to-tone.
# Lab: content/labs/capacitor-labels.ts.
format: bench
id: capacitor-labels
version: 2
title: Mind the stripe
summary: Put an electrolytic in the right way and the wrong way, and read the voltage on its can.
minutes: 6
lab: capacitor-labels
unlocks:
  parts: []
  isle: ceramic-cap

start:
  title: Mind the stripe
  say: Electrolytics have a right way round. Let's test it.
  go: Show me

beats:
  - say: Tap the 16 V can's minus leg.
    objective: The right way round
    tap: { answer: CB.neg, among: [CB.pos, CB.neg] }
    wrong:
      CB.pos: "That's the long leg, plus. Find the stripe."
    note: { at: CB.neg, text: "stripe and short leg: minus" }

  - say: Push it in. Long leg row 20, stripe row 21.
    tool: meter
    do: electrolytic-right-way
    done: A gulp, then almost nothing.
    note: { at: CB, text: "charged: just a tiny leak" }

  - say: Now turn it round. Will the meter settle?
    tool: meter
    guess: { options: [Settles near zero, Never settles], answer: Never settles }
    do: electrolytic-backwards
    done: It never settles. It's cooking!
    note: { at: CB, text: "backwards: leaks and heats" }

  - say: Pull it out before it pops.
    spot: [CB]
    do: pull-it-out

  - say: Our battery gives 9 V. Which can is safe?
    objective: Read the can
    pick: { options: [The 16 V can, The 6.3 V can], answer: The 16 V can }
    wrong:
      The 6.3 V can: "9 V is over its 6.3 V limit."
    rule: Stay under the voltage on the can.

secret:
  task: blast-box
  say: Curious? 6.3 V can, backwards, blast corner. Then slide S1.
  done: Bang! Heated, bulged, vented.

fixit:
  say: Fix-it time. This can keeps leaking. Why?
  tool: meter
  tasks:
    - task: fix-overvolt

end:
  say: Stripe to minus, volts to spare. You read the fine print.
