# Blueprint: docs/curriculum/unit-2.md, Lesson 12 (its first half); conversion: docs/curriculum/conversion-guide.md,
# C2 lesson 12. A bench lesson (docs/LESSONS.md). One idea: a capacitor across a choppy supply smooths it.
# Lab: content/labs/smoothing-and-coupling.ts. Coupling and blocking are the next lesson, kick-it-through.
format: bench
id: smoothing-and-coupling
version: 2
title: Smooth it
summary: Turn a stuttering supply into steady light with a capacitor across it.
minutes: 6
lab: smoothing-and-coupling
unlocks:
  parts: []
  isle: battery

start:
  title: Smooth it
  say: My lamp's power keeps stuttering. Can a capacitor help?
  go: Let's see

beats:
  - say: Start the auto-tapper. Watch my lamp.
    objective: A choppy supply
    tool: tapper
    do: flicker
    done: On, off, on, off. Headache.
    note: { at: D1, text: "choppy supply, choppy light" }

  - say: Push in the 470 µF. Long leg row 11, stripe row 13.
    objective: Smooth it out
    tool: tapper
    guess: { options: [Still flickers, Steady light, Goes dark], answer: Steady light }
    do: smooth-it
    done: Steady, from a stuttering supply.
    note: { at: C1, text: "fills on taps, feeds between" }
    rule: Across the supply, a capacitor smooths.

  - say: Bigger tank, smoother light. Always better?
    pick: { options: ["Yes, always", "No, slower to fill"], answer: "No, slower to fill" }
    wrong:
      "Yes, always": "A huge one fills slowly and gulps at switch-on."

secret:
  task: too-small
  say: Curious? Try the 47 µF instead.
  tool: tapper
  done: Flicker again.
  note: { at: C3, text: "small tank: ripple again" }

fixit:
  say: Fix-it time. Still flickering. Why?
  tool: tapper
  tasks:
    - task: fix-one-hole

end:
  say: A little tank across the supply. Smooth as soup.
