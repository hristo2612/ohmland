# Blueprint: docs/curriculum/unit-2.md, Lesson 6; conversion: docs/curriculum/conversion-guide.md, C2 (6).
# A bench lesson (docs/LESSONS.md). One idea: cutting a coil's flow makes a big backwards spike. New: the scope.
# Lab: content/labs/coil-kickback.ts. The clamp diode moved to the-diode.
format: bench
id: coil-kickback
version: 2
title: The coil kicks back
summary: Catch the voltage spike a coil makes when you switch it off, and soak it up with an LED.
minutes: 7
lab: coil-kickback
unlocks:
  parts: [scope]
  isle: diode

start:
  title: The coil kicks back
  say: Coils hate being cut off. Let's catch one sulking.
  go: Let's catch it

beats:
  - say: This is a scope. Arm it, then tap S1. Guess the peak.
    objective: Catch the spike
    tool: scope
    guess: { options: [About 9 V, Almost 0 V, Far over 9 V], answer: Far over 9 V }
    do: watch-the-spike
    done: Hundreds of volts, backwards! And a spark.
    note: { at: K1.coil1, text: "hundreds of volts, for a blink" }
    rule: A coil kicks back when cut off.

  - say: A meter missed that. Why did the scope catch it?
    pick: { options: [It's faster, It's bigger], answer: It's faster }
    wrong: { It's bigger: "Size isn't it. The spike lasts a blink. Speed is." }

  - say: Put the red LED across the coil, backwards. Release again.
    objective: Catch it with an LED
    tool: scope
    do: led-catcher
    done: A blink on release. No spike, no spark.
    note: { at: K1, text: "the field collapses and pushes on" }

  - say: The button was open. What lit the LED?
    pick: { options: [The coil's field, The battery, The scope], answer: The coil's field }
    wrong:
      The battery: The button had cut it off. Something else pushed.
      The scope: The scope only watches. It never pushes.

fixit:
  say: My spike catcher let a spark through. Fix it.
  tool: scope
  tasks:
    - task: fix-catcher

end:
  say: Coils sulk when cut off. Now you can catch them at it.
