# Blueprint: docs/curriculum/unit-2.md, Lesson 4; conversion: docs/curriculum/conversion-guide.md, C2 (4).
# A bench lesson (docs/LESSONS.md). One idea: a coil's magnet moves a switch, and the coil never touches the contacts.
# New: the relay (coil, COM, NC, NO). Lab: content/labs/meet-the-relay.ts; the clean-map bonus keeps the pin-sleuth
# trigger.
format: bench
id: meet-the-relay
version: 2
title: Flipped by a magnet
summary: Find the coil and the contacts of an unlabeled relay, and hear it switch for the first time.
minutes: 8
lab: meet-the-relay
unlocks:
  parts: [relay]
  isle: relay

start:
  title: Flipped by a magnet
  say: Five legs, no labels. One pair hides a magnet.
  go: Let's probe

beats:
  - say: Ohms dial. Find the pair that reads a few hundred.
    objective: Find the coil
    tool: meter
    do: find-the-coil
    done: About 540 Ω. A long, thin coil of copper.
    note: { at: wired:K1.coil1, text: "coil: flow makes a magnet" }

  - say: Beep dial now. Which other pair beeps at rest?
    objective: Find the contacts
    tool: meter
    do: find-com-nc
    note: { at: wired:K1.nc1, text: "COM and NC: joined at rest" }

  - say: Keep the probes there. Clip the coil, then hold S1. Guess first.
    objective: Make it click
    tool: meter
    guess: { options: [The beep stops, Nothing changes], answer: The beep stops }
    do: energize
    done: Click! COM let go of NC.
    note: { at: wired:K1.no1, text: "NO: joined while powered" }

  - say: Name all five terminals in the pin map.
    do: name-the-legs
    rule: Coil and contacts never touch.

  - say: Which reading was the coil?
    pick: { options: ["0.2 Ω", "540 Ω", "OL"], answer: "540 Ω" }
    wrong:
      "0.2 Ω": That's a closed contact. Almost no resistance.
      "OL": That's an open contact. No path at all.

secret:
  task: peek-relay
  say: Curious? Peek inside, then press S1.
  done: See it swing? That's the armature.
  note: { at: K1, text: "the armature swings" }

fixit:
  say: Pressing should light my lamp. It goes dark. Fix it.
  tasks:
    - task: fix-lamp-no

end:
  say: Flipped by a magnet. Clicks in my dreams tonight.
