# Split from relay-thresholds (docs/curriculum/conversion-guide.md, C2 5a). A bench lesson (docs/LESSONS.md).
# One idea: a relay chooses which lamp a second battery feeds. Lab: content/labs/relay-chooser.ts (changeover moved
# here from relay-thresholds). The coloured LEDs are already in the parts bin as led-color, so nothing new unlocks.
format: bench
id: relay-chooser
version: 1
title: Yellow or green
summary: Wire a relay's changeover contacts so it picks which of two lamps a second battery lights.
minutes: 5
lab: relay-chooser
unlocks:
  parts: []
  isle: led-lamp

start:
  title: Yellow or green
  say: Two lamps with their own battery. Let the relay choose.
  go: Let's wire

beats:
  - say: "Using only B2: yellow at rest, green while S1 is held."
    objective: Wire the chooser
    do: changeover
    done: The relay picks the lamp. Click, green. Rest, yellow.
    note: { at: B2, text: "B2 never touches B1" }
    rule: A relay can switch another circuit.

  - say: Unclip the coil's black lead from B1. Guess first.
    objective: Two worlds
    guess: { options: [Both lamps go out, Yellow stays on], answer: Yellow stays on }
    do: cut-the-coil
    done: Yellow stays. The lamps never needed B1.
    note: { at: D2, text: "fed by B2 alone" }

  - say: Show me the contact that feeds yellow.
    tap: { answer: K1.nc1, among: [K1.com1, K1.nc1, K1.no1] }
    wrong:
      K1.no1: That one feeds green, on the click.
      K1.com1: That's the chooser. It feeds both, in turn.

  - say: Could my 9 V coil switch a 24 V lamp circuit?
    pick: { options: ["Yes, contacts permitting", "No, only 9 V"], answer: "Yes, contacts permitting" }
    wrong: { "No, only 9 V": "The coil only cares about its own side." }

fixit:
  say: Green is on at rest. Fix it.
  tasks:
    - task: fix-green

end:
  say: Two worlds, one magnet. Relays do this all day long.
