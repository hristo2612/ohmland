# Blueprint: docs/curriculum/unit-2.md, Lesson 5; conversion: docs/curriculum/conversion-guide.md, C2 (5).
# A bench lesson (docs/LESSONS.md). One idea: a relay pulls in at one push and lets go at a much lower one.
# New: the knob (potentiometer). Lab: content/labs/relay-thresholds.ts. The changeover moved to relay-chooser.
format: bench
id: relay-thresholds
version: 2
title: Click in, click out
summary: Turn a knob to find the exact coil voltages where a relay pulls in and lets go.
minutes: 7
lab: relay-thresholds
unlocks:
  parts: [potentiometer]
  isle: wire-spool

start:
  title: Click in, click out
  say: How hard must you push a relay before it clicks?
  go: Find out

beats:
  - say: This is a knob, a potentiometer. Tap it.
    objective: Find the pull-in
    meet: P1
    note: { at: P1, text: knob (potentiometer) }

  - say: Turn it up slowly. Type the meter's reading at the click.
    tool: controls
    do: find-pull-in
    done: Click! The green lamp agrees.
    note: { at: K1, text: "pull-in: about 6 V" }

  - say: Now turn it down slowly. Where does it let go? Guess first.
    objective: Find the drop-out
    tool: controls
    guess: { options: [Also about 6 V, Well below 6 V, Above 6 V], answer: Well below 6 V }
    do: find-drop-out
    done: Under 2 V! Once in, it hangs on.
    note: { at: K1, text: "close up, the magnet pulls harder" }
    rule: Two thresholds stop the chatter.

  - say: In at 6.1 V, out at 1.7 V. Is this relay faulty?
    pick: { options: [Working fine, Faulty], answer: Working fine }
    wrong: { Faulty: "The gap is built in. That's what stops the chatter." }

fixit:
  say: The relay never clicks, whatever the knob. Fix it.
  tool: controls
  tasks:
    - task: fix-wiper

end:
  say: In high, out low. A relay with nerves of steel.
