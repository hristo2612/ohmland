# Blueprint: docs/curriculum/unit-1.md, L2.
id: meet-the-meter
version: 1
title: Meet your multimeter
summary: Plug in the leads, set the dial and take your first real reading of a battery.
minutes: 12
unlocks:
  parts: [multimeter, test-leads]
  isle: meter-kiosk
steps:
  - type: hook
    body: |
      The robot hands you a chunky gadget with a dial, a screen and two wires, one red and one black. "This is how we
      see electricity," it beeps. You can't watch current or feel voltage, but this meter can measure both, plus
      resistance. Every experiment on this island starts with it. First job: find out whether the bench battery is
      fresh or tired.
    visual: { kind: part, part: multimeter }
    predict:
      prompt: A brand-new battery is labelled 9 V. What will the meter read?
      options:
        - Exactly 9.00 V
        - A little under 9 V
        - A little over 9 V
    mascot: Meet my favourite tool. It sees what we can't.

  - type: lab
    lab: meet-the-meter

  - type: explain
    cards:
      - title: Four sockets, two leads
        body: |
          The black lead lives in **COM**, short for common, and almost never moves. The red lead does the moving. For
          volts and ohms it goes in **VΩ**. For small currents it goes in **mA**, and for big currents in **10A**.
          Plugging the red lead into the wrong socket is the most common meter mistake, so glance at it before every
          measurement.
        # widget (planned): meter-explorer. Hover or tap any socket or dial sector to see what it is for.
      - title: Reading the dial
        body: |
          Each part of the dial is one kind of measurement. V with a straight line means DC volts: the steady kind a
          battery makes. V with a wavy line means AC volts, the kind in wall sockets. A means amps and mA means
          milliamps. Ω, the Greek letter omega, means ohms, for resistance. A little sound-wave icon marks continuity:
          the meter beeps when two points are connected.
      - title: Why 9.4 and not 9?
        body: |
          A battery's label gives its nominal voltage, a round number for its type. A fresh 9 V alkaline battery usually
          reads about 9.4 to 9.6 V with nothing connected. As it gets used, the reading slides down, so a quick voltage
          check tells you roughly how much life is left. A reading well under 9 V means the battery is getting tired.
      - title: A minus sign is just information
        body: |
          Swap the probes and the meter shows a minus sign. Nothing is wrong. The meter always reports the red probe's
          voltage compared with the black probe's. A negative number just means the black probe is touching the more
          positive side. That makes the meter a handy way to find out which end of something is plus.

  - type: quiz
    items:
      - id: black-lead
        type: choice
        prompt: Where does the black lead go?
        options:
          - text: COM
            correct: true
            why: COM is the shared reference socket for every measurement.
          - text: VΩ
            why: That is where the red lead goes for volts and ohms.
          - text: mA
            why: The red lead goes there to measure small currents. Black stays in COM.
        explain: Black in COM, always. Only the red lead moves between sockets.

      - id: pick-range
        type: choice
        prompt: Your manual meter has DC volt ranges of 200 mV, 2 V, 20 V and 200 V. Which suits a 9 V battery best?
        options:
          - text: 20 V
            correct: true
            why: It is the smallest range bigger than 9 V, so it shows the most digits.
          - text: 2 V
            why: 9 V is over this range's limit, so the screen shows OL.
          - text: 200 V
            why: "It works, but you lose detail: you would see 9.4 instead of 9.42."
          - text: 200 mV
            why: Far too small. You would see OL.
        explain: Pick the smallest range that is still bigger than what you expect to measure.

      - id: negative-reading
        type: choice
        prompt: You measure a battery and the screen shows -9.42. What happened?
        options:
          - text: The probes are on the opposite terminals
            correct: true
            why: Red is on minus and black on plus, so the meter shows a negative number.
          - text: The battery is wired backwards inside
            why: A battery cannot flip itself. The meter only compares its two probes.
          - text: The meter is damaged
            why: Measuring volts the wrong way round is harmless. The minus sign is information.
        explain: The reading is always red compared with black. Swap them and the sign flips.

      # Blueprint item dial-hotspot asked for the DC volts sector of the dial, but the multimeter figure has no dial
      # sectors as regions (only display, dial, com, vohm, a10), so this asks for the red lead's socket instead.
      - id: volts-socket
        type: hotspot
        figure: multimeter
        prompt: Tap the socket the red lead goes into when you measure a battery's voltage.
        answer: vohm
        hint: Batteries make voltage. Look for the socket marked with a V.
        explain: |
          Volts go through the socket marked V (on this meter it shares a socket with mA, marked VΩmA). Black stays in
          COM, and 10A is only for big currents.

      - id: ac-symbol
        type: choice
        prompt: Which marking means AC volts?
        options:
          - text: V with a wavy line
            correct: true
            why: The wave stands for voltage that keeps reversing, like a wall socket's.
          - text: V with a straight line
            why: That one means DC, the steady kind from a battery.
          - text: Ω
            why: That is the ohms setting, for resistance.
        explain: Wavy means AC, straight means DC.

      - id: blank-screen
        type: choice
        prompt: The dial is on 20 V DC and the probes are on a battery, but the screen is completely blank. Most likely cause?
        options:
          - text: The meter's own battery is flat or missing
            correct: true
            why: A meter needs its own power to show anything.
          - text: The battery being tested is dead
            why: A dead battery would still show a number, such as 0.00 or a low voltage. A blank screen means the meter itself is off.
          - text: The probes are swapped
            why: Swapped probes show a minus sign, not a blank screen.
        explain: A totally blank display almost always means the meter has no power of its own.

  - type: wrap
    rules:
      - Black lead in COM. Red lead moves, so check it first.
      - Measure voltage with the probes on two points.
      - A minus sign means the probes are swapped, nothing more.
      - Switch the meter off when you're done.
    realWorld:
      parts:
        - Any digital multimeter
        - A 9 V alkaline battery
      safety:
        - Checking a battery's voltage is completely safe.
        - Keep your meter away from wall sockets. Mains needs a properly rated meter and training.
