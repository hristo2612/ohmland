# Blueprint: docs/curriculum/start-here.md, SH1 "The dark lamp". A bench lesson (docs/LESSONS.md).
# One idea: flow needs a closed loop, metal on metal all the way round. Lab: content/labs/welcome-to-the-bench.ts.
# A reference lesson for the voice (docs/LESSONS.md, "Writing beats"; docs/curriculum/voice-rewrite.md): why first on
# the first beat of each objective, the secret and the fix-it; one clear instruction on every other beat.
format: bench
id: welcome-to-the-bench
version: 3
title: Welcome to the bench
summary: A desk lamp will not light. Find the gap, and learn that flow needs a closed loop.
minutes: 5
lab: welcome-to-the-bench
unlocks:
  parts: [battery-9v, alligator-clips]
  isle: led-lamp

start:
  title: The dark lamp
  say: My desk lamp won't light, and I can't see why. Will you help me find out?
  go: Take the case

beats:
  - say: Let's try the easy fix first. Flip the switch, the silver lever on the wooden block, over to ON.
    objective: Find the gap
    do: close-the-switch

  - say: The path is broken somewhere. Tap the minus (−) snap, the metal stud on the battery, and my pencil will follow the wires.
    tap: { answer: B1.neg, among: [B1.pos, B1.neg] }
    trace: B1.neg
    wrong: { B1.pos: "That's the plus (+) snap. Tap the other metal stud, marked minus (−)." }
    done: My pencil stops at the red clip, the jaws on the red wire, because it bites plastic, not metal.
    note: { at: TL1.a, text: "this clip bites plastic: a gap" }

  - say: Drag the red clip off the battery's plastic wrapper and onto its plus (+) snap, the other metal stud.
    do: find-the-gap
    trace: B1.neg
    done: It glows! Now electricity can flow from the battery, through metal all the way round, and back.
    note: { at: D1, text: "loop: metal all the way round" }
    rule: Flow needs a closed loop of metal.

  - say: Let's test the loop rule. Guess what the lamp will do, then pull the black clip off the lamp.
    objective: Break it, mend it
    guess: { options: [It stays lit, It dims, It goes dark], answer: It goes dark }
    do: break-the-loop
    done: Dark at once, because one gap anywhere breaks the whole loop.
    note: { at: D1, text: "one gap, all dark" }

  - say: Put the loose clip back on the metal it came from, so the loop is closed again.
    do: mend-the-loop

  - say: What do we call a metal path that runs from the battery, all the way round, and back?
    pick: { options: [a loop, a lamp, a line], answer: a loop }
    wrong: { a lamp: "The lamp is one stop on the path. What is the whole path called?", a line: "A line has two ends. This path has none: it comes back round." }

secret:
  task: swap-battery-leads
  say: "Bonus: let's see if the way round matters. Swap the battery's two clips, red onto minus and black onto plus."
  done: Dark, but nothing broke, because this lamp only lets flow through one way.
  note: { at: D1, text: "backwards: dark, no harm" }

fixit:
  say: Fix-it time, and now you know what to look for. The switch is on, but the lamp stays dark. Find the gap.
  tasks:
    - task: fix-it

end:
  say: Case closed. You followed the loop, found the gap, and my lamp is lit for the first time in ages.
