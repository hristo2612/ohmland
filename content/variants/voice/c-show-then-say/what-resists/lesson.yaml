# Voice variant C, "Show, then say": content/units/basics/resistance/what-resists with short lines, while the bench draws
# each beat's first move (the coach mark, `coach: true` in variants.yaml).
format: bench
id: what-resists
version: 1
title: What resists?
summary: Turn the dial to Ω and measure your own skin, dry and then wet.
minutes: 6
lab: what-resists
unlocks:
  parts: []
  isle: wire-spool

start:
  title: Your skin resists
  say: Even your skin slows electricity a little. Let's measure it.
  go: Let's measure

beats:
  - say: Turn the meter's dial to Ω, for ohms.
    objective: Dry skin
    tool: meter
    do: dry-skin
    done: Almost a million ohms, from dry skin!
    note: { at: P1, text: "Ω: the meter sends its own tiny flow" }
    rule: "Ohms: measure with no battery connected."

  - say: It says 0.840 MΩ. How many kΩ is that?
    tool: meter
    number: { answer: 840, unit: kΩ, tolerance: 1 }
    hint: M is a million. k is a thousand.
    note: { at: part:M1/display, text: "M: mega, a million" }

  - say: Guess, then tap WET on the skin patch.
    objective: Wet skin
    tool: meter
    guess: { options: [more ohms, about the same, fewer ohms], answer: fewer ohms }
    do: wet-skin
    done: About 46 kΩ. Water lets the flow in.
    note: { at: P1, text: "dry 840 kΩ, wet 46 kΩ" }

  - say: Quick check. What does Ω measure?
    pick: { options: [push, flow, squeeze], answer: squeeze, on: part:M1/dial }
    wrong: { push: "Push is V, volts. Try again.", flow: "Flow is A, amps. Try again." }

secret:
  task: double-spacing
  say: "Bonus: slide the probe on 2 to the 4 mark. Double?"
  tool: meter
  done: Up a little. Nowhere near double.
  note: { at: P1, text: most ohms are where the tips touch }

fixit:
  say: Fix-it time. OL means too big for this range. Get a number.
  tool: meter
  tasks:
    - task: fix-dry

end:
  say: You resist. Now you can prove it.

labLines:
  dry-skin:
    hints:
      - Ω is just after V~ on the dial, or on the meter panel.
    nudges:
      - OL? Pick 2 MΩ under Range.
    success: Almost a million ohms.
  wet-skin:
    hints:
      - WET is a tab on the front of the patch.
    nudges:
      - Keep the probes 2 cm apart.
    success: Tens of thousands of ohms.
  fix-dry:
    hints:
      - The skin is over 200 kΩ.
      - Pick 2 MΩ under Range.
    success: Fixed.
  double-spacing:
    hints:
      - Drag the tip on 2 to the 4 mark.
    success: Up, but nowhere near double.
