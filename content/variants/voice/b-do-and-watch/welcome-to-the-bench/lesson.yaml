# Voice variant B, "Do + watch": content/units/start-here/first-cases/welcome-to-the-bench as a short instruction plus a
# quieter line (watch) saying what to look for, or why.
format: bench
id: welcome-to-the-bench
version: 1
title: Welcome to the bench
summary: A desk lamp will not light. Find the gap, and learn that flow needs a closed loop.
minutes: 5
lab: welcome-to-the-bench
unlocks:
  parts: [battery-9v, alligator-clips]
  isle: led-lamp

start:
  title: The dark lamp
  say: My desk lamp won't light. Will you find out why?
  go: Take the case

beats:
  - say: Flip the switch's silver lever to ON.
    watch: Then look at the little red lamp. Does it light up?
    objective: Find the gap
    do: close-the-switch

  - say: Tap the battery's minus (−) snap.
    watch: My pencil will follow the wires from there. Look where it stops.
    tap: { answer: B1.neg, among: [B1.pos, B1.neg] }
    trace: B1.neg
    wrong: { B1.pos: "That's plus (+). Tap the other snap, minus (−)." }
    done: It stops at the red clip. That clip bites plastic, not metal.
    note: { at: TL1.a, text: "this clip bites plastic: a gap" }

  - say: Drag the red clip onto the battery's plus (+) snap.
    watch: Right now it bites the plastic wrapper. Metal has to touch metal.
    do: find-the-gap
    trace: B1.neg
    note: { at: D1, text: "loop: metal all the way round" }
    rule: Flow needs a closed loop of metal.

  - say: Guess, then pull one clip off, far from the lamp.
    watch: Keep your eyes on the lamp as the clip comes off.
    objective: Break it, mend it
    guess: { options: [It stays lit, It dims, It goes dark], answer: It goes dark }
    do: break-the-loop
    done: Dark at once. One gap anywhere stops it all.
    note: { at: D1, text: "one gap, all dark" }

  - say: Clip the loose clip back where it was.
    watch: That closes the loop, so the lamp should light again.
    do: mend-the-loop

  - say: What do we call metal that goes all the way round?
    watch: Follow the wires with your eyes, from plus round to minus.
    pick: { options: [a loop, a lamp, a line], answer: a loop }

secret:
  task: swap-battery-leads
  say: "Bonus: swap the two battery clips. Watch the lamp."
  done: Dark, and nothing broke. This lamp only works one way round.
  note: { at: D1, text: "backwards: dark, no harm" }

fixit:
  say: Fix-it time. The switch is on, but the lamp is dark. Find the gap.
  tasks:
    - task: fix-it

end:
  say: Case closed. My lamp is lit again.

labLines:
  close-the-switch:
    hints:
      - The switch is the wooden block marked OFF and ON. Drag its lever.
    success: Click. On, but still dark.
  find-the-gap:
    hints:
      - The red clip is on top of the battery. Drag it onto the stud marked plus (+).
    nudges:
      - Keep the switch on ON for this one.
    success: It glows! Metal all the way round.
  break-the-loop:
    hints:
      - Drag any clip off its metal, like the black one on the battery.
    nudges:
      - Keep the switch on ON for this one.
    success: Dark.
  mend-the-loop:
    hints:
      - Drag the loose clip back onto the metal it came from.
    success: Light's back. The loop is closed.
  fix-it:
    hints:
      - Follow the clips round. One bites wood, not metal.
      - Move that clip onto the metal screw beside it.
    success: Wood is a gap too. Fixed.
  swap-battery-leads:
    hints:
      - Unclip both battery clips, then clip each onto the other snap.
    success: Dark, and nothing broke.
