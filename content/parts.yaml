# The parts bin catalog. Lessons unlock parts by id (lesson.yaml: unlocks.parts).
# `icon` picks the 2D drawing; a 3D preview comes later from packages/bench.
# Each part's longer description from the unit blueprints is kept as a comment until the schema has a field for it.
parts:
  # Unit 1: Basics (docs/curriculum/unit-1.md, section 11), in the order lessons unlock them.

  # description: The rectangular battery with two snap terminals on top. It's the workhorse power source of this
  # unit: safe, cheap and just strong enough to teach every lesson about current, heat and fuses.
  - id: battery-9v
    name: 9 V battery
    icon: battery
    blurb: The workhorse power source of Unit 1, with two snap terminals on top.
    facts:
      - "Nominal 9 V. A fresh alkaline one reads about 9.4 to 9.6 V at rest."
      - "Six 1.5 V alkaline cells in series inside."
      - "Capacity about 500 mAh at light loads. Internal resistance about 1.5 to 2 Ω when fresh."
      - "Terminals: the small round snap is plus, the larger six-sided snap is minus."
      - "Symbol: several pairs of long and short parallel lines. The long line is plus."
      - "Safety: don't carry it loose with coins or keys. A shorted 9 V battery gets hot."

  # description: Short wires with a sprung, toothed clip at each end. Clip one to a battery terminal and the other to
  # a part's leg and you have a connection, no soldering needed. All of Unit 1 is built with them.
  - id: alligator-clips
    name: Clip leads
    icon: jumper-wire
    blurb: Short wires with a sprung clip at each end. Connections with no soldering.
    facts:
      - "About 0.1 to 0.2 Ω each, including the clip contacts."
      - "Colours are labels, not rules. By habit, red goes to plus and black to minus."
      - "Every clip is a possible loose connection: check them first when a circuit misbehaves."
      - "Symbol: a plain line, like any wire."
      - "Safety: none at battery voltages."

  # description: Your measuring tool for the whole course. A rotary dial chooses what to measure (volts, amps, ohms or
  # continuity) and how big a value to expect. The screen shows up to 1999 counts, OL when a value is too big for the
  # range, and a minus sign when the probes are the other way round. A meter can't fix a circuit, but it will always
  # tell you the truth about one.
  - id: multimeter
    name: Multimeter
    icon: multimeter
    blurb: Your measuring tool for the whole course. Volts, amps, ohms and continuity.
    facts:
      - "DC volts input resistance: 10 MΩ, so it barely disturbs a circuit."
      - "mA input protected by a 200 mA fuse. 10A input unfused, for about 10 s at a time."
      - "Ohms ranges from 200 Ω to 2 MΩ. Continuity beeps below about 30 Ω."
      - "Black lead in COM always. The red lead moves between VΩ, mA and 10A."
      - "Symbol: a circle with a letter inside: V for a voltmeter, A for an ammeter, Ω for an ohmmeter."
      - "Safety: check the red lead's socket before every measurement. Never probe a wall socket."

  # description: A red and a black lead, each with a shrouded plug at one end and a sharp steel tip at the other.
  # Insulated handles with finger guards keep your fingers away from the metal. Swap the tips for small hook grabbers
  # when you want both hands free.
  - id: test-leads
    name: Meter probes
    icon: test-leads
    blurb: A red and a black lead that connect the meter to whatever you measure.
    facts:
      - "About 0.1 Ω each, which only matters when measuring tiny resistances."
      - "Black plugs into COM. Red plugs into VΩ, mA or 10A, depending on the job."
      - "Touching both tips together on the ohms range shows the leads' own resistance."
      - "Symbol: drawn as plain lines to the meter symbol."
      - "Safety: hold probes behind the finger guards."

  # description: The everyday cylindrical cell in remotes, toys and torches. Bigger electrodes than a 9 V battery give
  # it far more capacity and much lower internal resistance.
  - id: battery-aa
    name: AA cell
    icon: battery
    blurb: The everyday cylindrical cell in remotes, toys and torches.
    facts:
      - "Nominal 1.5 V (alkaline). A fresh one reads about 1.55 to 1.65 V."
      - "Capacity about 2,000 to 2,800 mAh at light loads."
      - "Internal resistance about 0.1 to 0.2 Ω when fresh."
      - "The end with the raised button is plus. The flat end is minus."
      - "Symbol: one long and one short parallel line. The long line is plus."
      - "Safety: don't try to recharge alkaline cells, and don't mix old and new cells in one device."

  # description: A line of graphite drawn on card. Graphite is carbon that conducts, just not very well, so a pencil
  # line is a resistor you can draw, shade and reshape. Slide a probe along it and you have a homemade potentiometer.
  - id: pencil-line
    name: Pencil-line resistor
    icon: pot
    blurb: A resistor you can draw. Graphite conducts, just not very well.
    facts:
      - "Typical values: tens of kilohms to a few megohms, depending on the pencil, paper and line."
      - "Resistance grows with length and falls with width and darkness."
      - "A sliding contact turns it into a variable resistor."
      - "Symbol: a resistor symbol. Add a diagonal arrow through it when it is used as a variable resistor."
      - "Safety: none."

  # description: The most common part in electronics. A small cylinder with a wire at each end and coloured stripes
  # that tell you its value. It sets how much current flows in a circuit, and it doesn't care which way round it goes.
  - id: resistor
    name: Resistor (1/4 W)
    icon: resistor
    blurb: The most common part in electronics. Its stripes tell you its value.
    facts:
      - "Power rating 1/4 W (0.25 W)."
      - "Gold stripe: ±5% tolerance. Silver: ±10%. Brown, on 5-stripe parts: ±1%."
      - "Common values follow the E6 and E12 series: 10, 15, 22, 33, 47, 68 (E6), plus 12, 18, 27, 39, 56, 82 (E12)."
      - "Colour code: black 0, brown 1, red 2, orange 3, yellow 4, green 5, blue 6, violet 7, grey 8, white 9."
      - "Symbol: a zigzag line, or a small rectangle in IEC style."
      - "Safety: wear glasses when trimming leads. The clipped ends can fly."

  # description: A light-emitting diode in a red 5 mm dome. It glows when current flows from its anode to its cathode,
  # and blocks current the other way. It always needs something, usually a resistor, to limit its current.
  - id: led-red
    name: Red LED (5 mm)
    icon: led
    blurb: A light that only works one way round, and always needs its current limited.
    facts:
      - "Forward voltage about 1.8 to 2.2 V (around 2 V at 20 mA)."
      - "Typical current 20 mA. Absolute maximum 50 mA for the bench LED; many small LEDs are rated lower, so check the datasheet."
      - "Maximum reverse voltage about 5 V."
      - "Longer leg is the anode (plus). Shorter leg, by the flat spot on the rim, is the cathode (minus)."
      - "Symbol: a triangle pointing into a bar, with two small arrows pointing away for the light."
      - "Safety: never connect it straight across a battery without a resistor."

  # description: The same idea as the red LED, with different crystals for different colours. The colour sets the
  # forward voltage, so a resistor that suits a red LED gives a blue one less current.
  - id: led-color
    name: Coloured LEDs
    icon: led
    blurb: Different crystals, different colours, different forward voltages.
    facts:
      - "Orange and yellow: about 2.0 to 2.2 V."
      - "Yellow-green indicator types: about 2.1 V. Bright (true) green: about 3.0 to 3.4 V."
      - "Blue and white: about 2.8 to 3.4 V."
      - "Same current limits as the red LED: design for 5 to 15 mA."
      - "Symbol: the LED symbol. The colour is written beside it."
      - "Safety: don't stare into bright blue or white LEDs at close range."

  # description: A chunky resistor in a white ceramic body. It does the same job as a small resistor, but its size lets
  # it shed far more heat, so it survives loads that would burn a 1/4 W part in seconds.
  - id: resistor-power
    name: Power resistor (5 W)
    icon: resistor
    blurb: A chunky ceramic resistor that sheds far more heat than a small one.
    facts:
      - "Power rating 5 W. The value and rating are printed on the body instead of stripes."
      - "Runs well above 100 °C near its full rating, and that's normal for this type."
      - "Used in Unit 1 as a 15 Ω load across a 9 V battery (about 4.5 W)."
      - "Symbol: the resistor symbol, with the wattage written beside it."
      - "Safety: it gets hot enough to burn. Let it cool, and keep it clear of anything that can melt."

  # description: A thin metal wire sealed in a glass tube with metal caps. Too much current for too long melts the wire
  # and breaks the circuit, protecting everything else. It is the one part designed to fail.
  - id: fuse
    name: Glass fuse
    icon: fuse
    blurb: A thin wire in a glass tube. The one part designed to fail.
    facts:
      - "Common size 5 × 20 mm. Unit 1 uses fast-acting 1 A and 3 A fuses."
      - "The rating is what it carries indefinitely. Bigger overloads blow it faster."
      - "No polarity."
      - "A blown fuse reads OL on continuity, and often shows a visible gap."
      - "Symbol: a small rectangle with a line running through it lengthwise (IEC), or an S-shaped line (older US style)."
      - "Safety: always replace a fuse with the same rating, never a bigger one or a bit of wire."

  # description: A lemon with a copper coin and a zinc-plated strip pushed into it. The zinc reacts with the acidic
  # juice, and a small voltage appears between the two metals. Weak, slow and wonderful.
  - id: fruit-cell
    name: Fruit cell
    icon: cell
    blurb: A lemon, a copper coin and a zinc strip. Weak, slow and wonderful.
    facts:
      - "About 0.9 V per cell. Copper is plus, zinc is minus."
      - "Internal resistance around a thousand ohms, so the current stays well under 1 mA."
      - "Cells in series add voltage: four make about 3.6 V, enough for a faint red glow."
      - "The electrodes must not touch. Two of the same metal give about 0 V."
      - "Symbol: a single cell: one long and one short parallel line."
      - "Safety: don't eat the fruit afterwards. Wash your hands."

  # description: A flat, round lithium cell like the ones in watches and key fobs. It holds its voltage for years at
  # tiny currents, but its high internal resistance means it sags quickly under a heavy load.
  - id: coin-cell
    name: 3 V coin cell
    icon: battery
    blurb: A flat lithium cell for watches and key fobs. A sipper, not a gulper.
    facts:
      - "Nominal 3 V. A fresh one reads about 3.0 to 3.3 V."
      - "The common 20 mm size (often marked 2032) holds about 220 mAh."
      - "Internal resistance about 10 to 20 Ω when fresh, rising with age and cold."
      - "The flat face with the printing is plus."
      - "Symbol: a single cell: one long and one short parallel line."
      - "Safety: keep coin cells away from small children. A swallowed one can cause serious internal burns. Never recharge one."
